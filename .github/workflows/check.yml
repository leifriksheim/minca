name: Check

on:
  pull_request:
  push:
    branches: [main]

# A new push to a branch cancels the run still going for the push before it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # The tests and the static checks run side by side, each on its own runner.
  # Core's tests take as long as the rest together, so they get a runner of
  # their own. More runners than this costs minutes: each job bills a whole one.
  # A row with `paths` runs only when a changed file matches them.
  check:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          # Core's tests also test the relay, which has none of its own.
          - name: test core
            run: npm test -w packages/core
            paths: '^(packages/(core|relay)/|package(-lock)?\.json$|tsconfig\.base\.json$|\.github/workflows/check\.yml$)'
          # Every other workspace, by folder: a new app is picked up, a new package must be added.
          - name: test
            run: npm test --if-present -w packages/cli -w packages/relay -w packages/calls -w apps -w scenarios
          # Format, lint, typecheck and fallow: seconds each, so one runner.
          - name: check
            run: npm run check
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The history to diff against, only for a row that has paths.
          fetch-depth: ${{ matrix.paths && '0' || '1' }}
      - id: changed
        shell: bash
        env:
          PATHS: ${{ matrix.paths }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        # When there is no base, or it can't be read (a new branch), run anyway.
        run: |
          if [[ -z "$PATHS" || -z "$BASE" ]] || ! files=$(git diff --name-only "$BASE"...HEAD 2>/dev/null) || grep -qE "$PATHS" <<<"$files"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changed.outputs.run == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      # node_modules itself, so an unchanged lockfile skips the install.
      - if: steps.changed.outputs.run == 'true'
        id: modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            node_modules
            */*/node_modules
          key: modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}
      - if: steps.changed.outputs.run == 'true' && steps.modules.outputs.cache-hit != 'true'
        run: npm ci
      - if: steps.changed.outputs.run == 'true'
        run: ${{ matrix.run }}

  # The downloads (build.yml) build on every PR, so a broken one shows before a
  # release does. The desktop app takes a macOS runner and minutes, so only when
  # something in it changes.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      desktop: ${{ steps.changed.outputs.desktop }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: changed
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          files=$(git diff --name-only "$BASE"...HEAD 2>/dev/null) || files=apps/desktop/
          if grep -qE '^(apps/(desktop|example|shared)|packages/(core|cli)|package-lock\.json|\.github/workflows/build\.yml)' <<<"$files"; then
            echo "desktop=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: changes
    uses: ./.github/workflows/build.yml
    with:
      desktop: ${{ needs.changes.outputs.desktop == 'true' }}

  # The scenario suite (scenarios/README.md), as its own check, when the spec,
  # the protocol library or the scenarios change.
  scenarios:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - id: changed
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        # When the base can't be read (a new branch), run them anyway.
        run: |
          files=$(git diff --name-only "$BASE"...HEAD 2>/dev/null) || files=scenarios/
          if grep -qE '^(spec|packages/core|scenarios)/' <<<"$files"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changed.outputs.run == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - if: steps.changed.outputs.run == 'true'
        id: modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            node_modules
            */*/node_modules
          key: modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}
      - if: steps.changed.outputs.run == 'true' && steps.modules.outputs.cache-hit != 'true'
        run: npm ci
      - if: steps.changed.outputs.run == 'true'
        run: npm run scenarios
