name: Review

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  # A PR that changes the protocol says what its adversarial review found (CLAUDE.md).
  adversarial-review:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: git diff --name-only "$BASE"...HEAD | node scripts/check-review.mjs
