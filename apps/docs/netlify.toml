# For a Netlify site whose base directory is `apps/docs` (minca.dev). The pages
# come from packages/core/docs and spec/, and the theme from packages/ui, so
# the whole workspace is installed, from the repository root.
[build]
  command = "cd ../.. && npm ci && npm run build -w apps/docs"
  publish = "out"
  # Netlify skips a build when nothing under the base directory changed, but
  # this is built from the docs, the spec, the tokens and the mark too. Exit 1 builds.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ../../packages/core/docs ../../packages/calls/README.md ../../spec ../../packages/ui/src/tokens.ts ../shared/src/mark.ts ../shared/src/Wordmark.tsx ../../package.json ../../package-lock.json"

[build.environment]
  NODE_VERSION = "22"

# Markdown copies of each page, for agents.
[[headers]]
  for = "/*.md"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"

[[headers]]
  for = "/*.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
