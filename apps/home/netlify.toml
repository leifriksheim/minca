# For a Netlify site whose base directory is `apps/home`. The home compiles
# the protocol from packages/core/src, so the whole workspace is installed,
# from the repository root.
[build]
  command = "cd ../.. && npm ci && npm run build -w apps/home"
  publish = "dist"
  # Netlify skips a build when nothing under the base directory changed, but
  # this is built from the shared UI and the protocol too. Exit 1 builds.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ../shared ../../packages/core ../../package.json ../../package-lock.json ../../tsconfig.base.json"

[build.environment]
  NODE_VERSION = "22"
