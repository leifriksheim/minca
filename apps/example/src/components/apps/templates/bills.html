<!-- Bills: std.expense and std.settlement, split and settled up like Splitwise, on tabs: a trip, a flat, a dinner. A tab is a std.list (kind "tab"), and an expense or a payment is on it by a std.list-item in it about the record, as Files puts files in categories. Each tab settles up on its own. Every share is written out exactly, in the expense's currency, so every device adds up the same balances. The tabs come first; one opens one level in (minca.go), so the app's bar names it and its Back comes back out. -->
<script>
  const {
    html,
    render,
    useState,
    useEffect,
    useMemo,
    useRef,
    useRecords,
    useCan,
    usePeople,
    useShown,
    useView,
    Avatar,
    Person,
    Empty,
  } = ui;
  const { Comments, Modal } = ui;
  const EXPENSE = 'std.expense';
  const SETTLEMENT = 'std.settlement';
  const LIST = 'std.list';
  const ITEM = 'std.list-item';
  /** A tab's kind of std.list; other apps keep lists too, like Lists' checklists and Files' categories */
  const TAB = 'tab';
  /** The view of what was written before there were tabs: on none */
  const EARLIER = 'earlier';
  const me = minca.me.did;
  const COMMON = ['EUR', 'USD', 'GBP', 'NOK', 'SEK', 'DKK', 'CHF', 'JPY', 'CAD', 'AUD'];
  const BY_REGION = {
    NO: 'NOK',
    SE: 'SEK',
    DK: 'DKK',
    GB: 'GBP',
    US: 'USD',
    CH: 'CHF',
    JP: 'JPY',
    CA: 'CAD',
    AU: 'AUD',
  };

  // Money is counted in whole minor units (cents, øre), never in floats.
  const digitsOf = (currency) => {
    try {
      return new Intl.NumberFormat('en', { style: 'currency', currency }).resolvedOptions()
        .maximumFractionDigits;
    } catch {
      return 2;
    }
  };
  /** "12.50" or "12,5" as minor units, or null */
  const toMinor = (text, currency) => {
    const match = /^\s*(\d{0,12})(?:[.,](\d*))?\s*$/.exec(String(text ?? ''));
    if (!match || (!match[1] && !match[2])) return null;
    const digits = digitsOf(currency);
    const fraction = (match[2] ?? '').slice(0, digits).padEnd(digits, '0');
    return Number(match[1] || '0') * 10 ** digits + Number(fraction || '0');
  };
  /** Minor units as the decimal string a record keeps */
  const toDecimal = (minor, currency) => {
    const digits = digitsOf(currency);
    const whole = Math.floor(Math.abs(minor) / 10 ** digits);
    const part = String(Math.abs(minor) % 10 ** digits).padStart(digits, '0');
    return (minor < 0 ? '-' : '') + whole + (digits ? '.' + part : '');
  };
  const show = (minor, currency) => {
    try {
      return new Intl.NumberFormat(undefined, { style: 'currency', currency }).format(
        minor / 10 ** digitsOf(currency),
      );
    } catch {
      return `${toDecimal(minor, currency)} ${currency}`;
    }
  };
  /** A total in parts by weight: the cents left over go one each to the largest remainders */
  const allocate = (total, weights) => {
    const sum = weights.reduce((a, b) => a + b, 0);
    if (sum <= 0) return weights.map(() => 0);
    const exact = weights.map((w) => (total * w) / sum);
    const parts = exact.map(Math.floor);
    let left = total - parts.reduce((a, b) => a + b, 0);
    const order = exact.map((x, i) => [x - parts[i], i]).sort((a, b) => b[0] - a[0] || a[1] - b[1]);
    for (const [, i] of order) if (left-- > 0) parts[i] += 1;
    return parts;
  };
  const today = () => {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  };
  const dayOf = (r) => (typeof r.body.date === 'string' ? r.body.date : r.createdAt.slice(0, 10));
  const dateText = (day, options) => new Date(`${day}T12:00:00`).toLocaleDateString(undefined, options);

  // Anyone can write records without this screen: read only what is there.
  const isMoney = (m) =>
    m && typeof m.amount === 'string' && typeof m.currency === 'string' && m.currency.length === 3;
  const isExpense = (r) =>
    r.body && typeof r.body.title === 'string' && isMoney(r.body.amount) && typeof r.body.paidBy === 'string';
  const isSettlement = (r) =>
    r.body && typeof r.body.from === 'string' && typeof r.body.to === 'string' && isMoney(r.body.amount);

  /**
   * What each person's part of an expense is, in minor units. Shares written
   * out count as written; people listed with none split what is left equally.
   * With no split at all, the people it names in owedBy split it.
   */
  function partsOf(body) {
    const currency = body.amount.currency;
    const total = toMinor(body.amount.amount, currency) ?? 0;
    const split = Array.isArray(body.split) ? body.split.filter((s) => s && typeof s.did === 'string') : [];
    const listed = split.length
      ? split
      : (Array.isArray(body.owedBy) ? body.owedBy : [])
          .filter((d) => typeof d === 'string')
          .map((did) => ({ did }));
    const fixed = listed.map((s) => (s.share === undefined ? null : toMinor(s.share, currency)));
    const open = fixed.filter((f) => f === null).length;
    const rest = Math.max(0, total - fixed.reduce((a, f) => a + (f ?? 0), 0));
    const even = allocate(rest, Array(open).fill(1));
    const parts = new Map();
    for (const [i, s] of listed.entries())
      parts.set(s.did, (parts.get(s.did) ?? 0) + (fixed[i] ?? even.shift() ?? 0));
    return { total, currency, parts };
  }

  /** Each person's balance, per currency: above zero they are owed, below they owe */
  function balancesOf(expenses, settlements) {
    const all = new Map();
    const add = (currency, did, minor) => {
      if (!all.has(currency)) all.set(currency, new Map());
      const one = all.get(currency);
      one.set(did, (one.get(did) ?? 0) + minor);
    };
    for (const e of expenses) {
      const { currency, parts } = partsOf(e.body);
      // Only what others owe the payer moves anything; the payer's own part is theirs.
      for (const [did, part] of parts)
        if (did !== e.body.paidBy) {
          add(currency, e.body.paidBy, part);
          add(currency, did, -part);
        }
    }
    for (const s of settlements) {
      const minor = toMinor(s.body.amount.amount, s.body.amount.currency) ?? 0;
      add(s.body.amount.currency, s.body.from, minor);
      add(s.body.amount.currency, s.body.to, -minor);
    }
    return all;
  }

  /** The fewest payments that settle everyone: the largest debt to the largest credit, again and again */
  function simplify(balances) {
    const payments = [];
    for (const [currency, one] of balances) {
      const owed = [...one].filter(([, b]) => b > 0).map(([did, b]) => ({ did, b }));
      const owing = [...one].filter(([, b]) => b < 0).map(([did, b]) => ({ did, b: -b }));
      while (owed.length && owing.length) {
        owed.sort((x, y) => y.b - x.b || x.did.localeCompare(y.did));
        owing.sort((x, y) => y.b - x.b || x.did.localeCompare(y.did));
        const amount = Math.min(owed[0].b, owing[0].b);
        payments.push({ from: owing[0].did, to: owed[0].did, minor: amount, currency });
        owed[0].b -= amount;
        owing[0].b -= amount;
        if (!owed[0].b) owed.shift();
        if (!owing[0].b) owing.shift();
      }
    }
    return payments;
  }

  const nameIn = (people, did) =>
    did === me ? 'You' : (people.find((p) => p.did === did)?.name ?? 'Someone');
  function useNames() {
    const people = usePeople() ?? [];
    return (did) => nameIn(people, did);
  }

  const linkOf = (record, rel) => record.links.find((l) => l.rel === rel)?.to;
  const titleOf = (tab) => (typeof tab.body?.title === 'string' && tab.body.title.trim()) || 'Untitled';

  /**
   * Writes an expense or a payment, then what puts it on the tab. If that second write fails, the
   * first goes too, so nothing is left on no tab by accident, and the reason is shown.
   */
  async function putOn(tab, collection, body) {
    const made = await minca.put(collection, body);
    if (!tab) return made;
    try {
      await minca.put(
        ITEM,
        {},
        {
          links: [
            { rel: 'in', to: tab },
            { rel: 'about', to: made.key },
          ],
        },
      );
    } catch (error) {
      await minca.remove(made.key).catch(() => {});
      throw error;
    }
    return made;
  }

  /** What you are owed (above zero) or owe, per currency, leaving out those settled */
  const mineIn = (balances) =>
    [...balances].map(([cur, one]) => [cur, one.get(me) ?? 0]).filter(([, b]) => b !== 0);

  /** An amount someone gets back (above zero) or owes, as a tag in its tone */
  const owing = (b, text) => html`<span class="tag" data-tone=${b > 0 ? 'good' : 'warn'}>${text}</span>`;

  /** Where you stand on a tab, in a few words */
  function standing(balances, count) {
    if (count === 0) return html`<small>Nothing on it yet</small>`;
    const mine = mineIn(balances);
    if (mine.length === 0) return html`<small>You're settled up</small>`;
    const [cur, b] = mine[0];
    return html`<span class="row">
      ${owing(b, `${b > 0 ? 'You are owed' : 'You owe'} ${show(Math.abs(b), cur)}${mine.length > 1 ? ' and more' : ''}`)}
    </span>`;
  }

  function Bills() {
    const allExpenses = useRecords(EXPENSE);
    const allSettlements = useRecords(SETTLEMENT);
    const lists = useRecords(LIST);
    const allItems = useRecords(ITEM);
    const [view, go] = useView();
    const [currency, setCurrency] = useState(null);
    const asked = useShown();
    const handled = useRef(null);
    useEffect(() => {
      minca.recall('currency').then((kept) => {
        const region = (navigator.language.split('-')[1] ?? '').toUpperCase();
        setCurrency(typeof kept === 'string' ? kept : (BY_REGION[region] ?? 'EUR'));
      });
    }, []);
    const expenses = useMemo(() => (allExpenses ?? []).filter(isExpense), [allExpenses]);
    const settlements = useMemo(() => (allSettlements ?? []).filter(isSettlement), [allSettlements]);
    const tabs = useMemo(() => (lists ?? []).filter((l) => l.body?.kind === TAB), [lists]);
    // Which tab each expense or payment is on: the first item about it in a tab that is here
    const tabKeys = new Set(tabs.map((t) => t.key));
    const items = (allItems ?? []).filter((i) => tabKeys.has(linkOf(i, 'in')) && linkOf(i, 'about'));
    const onTab = new Map();
    for (const i of items) if (!onTab.has(linkOf(i, 'about'))) onTab.set(linkOf(i, 'about'), linkOf(i, 'in'));
    const tabOf = (record) => onTab.get(record.key) ?? null;
    // An expense opened from elsewhere opens on its tab, once it has arrived.
    const [openKey, setOpenKey] = useState(null);
    useEffect(() => {
      if (!asked || handled.current === asked || !allExpenses || !lists || !allItems) return;
      handled.current = asked;
      const tab = tabs.find((t) => t.key === onTab.get(asked.key));
      if (tab) go(tab.key, titleOf(tab));
      else if (expenses.some((e) => e.key === asked.key)) go(EARLIER, 'Earlier');
      setOpenKey(asked.key);
    }, [asked, allExpenses, lists, allItems]);
    if (!allExpenses || !allSettlements || !lists || !allItems || !currency) return null;

    const remember = (cur) => {
      setCurrency(cur);
      minca.remember('currency', cur);
    };
    const shared = { currency, remember, items, openKey, setOpenKey, go };
    const on = (key) => ({
      expenses: expenses.filter((e) => tabOf(e) === key),
      settlements: settlements.filter((s) => tabOf(s) === key),
    });

    if (view === EARLIER) return html`<${Tab} ...${shared} tab=${null} ...${on(null)} />`;
    const open = view && tabs.find((t) => t.key === view);
    if (view && !open)
      return html`<main>
        <${Empty} shape="receipt" colour="lilac" title="This tab isn't here any more" />
      </main>`;
    if (open) return html`<${Tab} key=${open.key} ...${shared} tab=${open} ...${on(open.key)} />`;
    return html`<${Tabs} tabs=${tabs} on=${on} go=${go} />`;
  }

  /** Every tab, the one last added to first, where you stand on each, and a row to start another */
  function Tabs({ tabs, on, go }) {
    const mayCreate = useCan('create', LIST);
    const create = async (title) => {
      const made = await minca.put(LIST, { title, kind: TAB });
      go(made.key, title);
    };
    const touched = (tab) => {
      const { expenses, settlements } = on(tab.key);
      return [...expenses, ...settlements].reduce(
        (last, r) => (r.updatedAt > last ? r.updatedAt : last),
        tab.updatedAt,
      );
    };
    const sorted = [...tabs].sort((a, b) => touched(b).localeCompare(touched(a)));
    const earlier = on(null);
    const anyEarlier = earlier.expenses.length + earlier.settlements.length > 0;
    const row = (key, title, icon, { expenses, settlements }) =>
      html`<li key=${key}>
        <button data-intent="open" onClick=${() => go(key, title)}>
          <strong class="truncate">${icon ? `${icon} ` : ''}${title}</strong>
          ${standing(balancesOf(expenses, settlements), expenses.length + settlements.length)}
        </button>
      </li>`;
    return html`<main>
      ${
        sorted.length === 0 &&
        !anyEarlier &&
        html`<${Empty}
          shape="receipt"
          colour="lilac"
          title="No tabs yet"
          text="Start one for a trip, the flat or a dinner, then add what each of you pays."
        />`
      }
      <ul role="list" aria-label="Tabs">
        ${sorted.map((tab) => row(tab.key, titleOf(tab), tab.body.icon, on(tab.key)))}
        ${anyEarlier && row(EARLIER, 'Earlier', '', earlier)}
        ${mayCreate && html`<li><${AddRow} placeholder="New tab" onAdd=${create} /></li>`}
      </ul>
    </main>`;
  }

  /**
   * One tab: where you stand, who owes whom and the fewest payments that settle it, then what was
   * spent and paid, newest first. With no tab, what was written before there were tabs.
   */
  function Tab({ tab, expenses, settlements, items, currency, remember, openKey, setOpenKey, go }) {
    const mayAdd = useCan('create', EXPENSE);
    const maySettle = useCan('create', SETTLEMENT);
    const mayDelete = useCan('delete', tab?.key ?? '');
    const mayRename = useCan('edit', tab?.key ?? '');
    const [adding, setAdding] = useState(null);
    const [settling, setSettling] = useState(null);
    const [renaming, setRenaming] = useState(false);
    const [deleting, setDeleting] = useState(false);
    // The bar names the tab, and again when someone renames it.
    const title = tab ? titleOf(tab) : 'Earlier';
    useEffect(() => go(tab?.key ?? EARLIER, title), [tab?.key, title]);
    const names = useNames();
    const balances = balancesOf(expenses, settlements);
    const payments = simplify(balances);
    const mine = mineIn(balances);
    const used = [...new Set([currency, ...COMMON, ...balances.keys()])];
    const firstSettle = payments.find((p) => p.from === me) ?? payments.find((p) => p.to === me);
    const about = (key) => items.filter((i) => linkOf(i, 'about') === key);
    const opened = expenses.find((e) => e.key === openKey) ?? settlements.find((s) => s.key === openKey);
    const entries = [...expenses, ...settlements].sort(
      (a, b) => dayOf(b).localeCompare(dayOf(a)) || b.createdAt.localeCompare(a.createdAt),
    );
    const people = [...balances].flatMap(([cur, one]) =>
      [...one].filter(([, b]) => b !== 0).map(([did, b]) => ({ did, b, cur })),
    );
    people.sort((x, y) => (x.did === me ? -1 : y.did === me ? 1 : y.b - x.b));
    const removeTab = async () => {
      // What is on it goes with it, then what put it there, then the tab; what can't go stays, harmlessly.
      await Promise.allSettled([...expenses, ...settlements].map((r) => minca.remove(r.key)));
      await Promise.allSettled(
        items.filter((i) => linkOf(i, 'in') === tab.key).map((i) => minca.remove(i.key)),
      );
      await minca.remove(tab.key);
      go(null);
    };

    return html`<main>
      ${
        renaming &&
        html`<ul role="list">
          <li>
            <${AddRow}
              placeholder="Name"
              initial=${title}
              onAdd=${async (next) => {
                await minca.update(tab.key, { ...tab.body, title: next });
                setRenaming(false);
              }}
              onCancel=${() => setRenaming(false)}
            />
          </li>
        </ul>`
      }
      ${
        entries.length > 0 &&
        html`<article>
          ${
            mine.length === 0
              ? html`<div class="stack" data-gap="tight">
                  <small>All square</small>
                  <h1>You're settled up</h1>
                </div>`
              : mine.map(
                  ([cur, b]) =>
                    html`<div class="stack" data-gap="tight" key=${cur}>
                      <small>${b > 0 ? 'You are owed' : 'You owe'}</small>
                      <h1>${show(Math.abs(b), cur)}</h1>
                    </div>`,
                )
          }
          ${
            (mayAdd || maySettle) &&
            html`<div class="row">
              ${maySettle && entries.length > 0 && html`<button onClick=${() => setSettling(firstSettle ?? { from: me, to: null, minor: 0, currency })}>Settle up</button>`}
              ${mayAdd && tab && html`<button data-intent="primary" onClick=${() => setAdding({})}>Add an expense</button>`}
            </div>`
          }
        </article>`
      }
      ${
        payments.length > 0 &&
        html`<section>
          <h2>To settle up</h2>
          <ul role="list" aria-label="To settle up">
            ${payments.map(
              (p, i) =>
                html`<li class="row" data-spread key=${i}>
                  <span class="row">
                    <${Avatar} did=${p.from} size=${28} round />
                    <span>
                      ${names(p.from)} ${p.from === me ? 'pay' : 'pays'} ${p.to === me ? 'you' : names(p.to)}
                      <strong> ${show(p.minor, p.currency)}</strong>
                    </span>
                  </span>
                  ${maySettle && (p.from === me || p.to === me) && html`<button onClick=${() => setSettling(p)}>Record</button>`}
                </li>`,
            )}
          </ul>
        </section>`
      }
      ${
        people.length > 1 &&
        html`<section>
          <h2>Balances</h2>
          <ul role="list" aria-label="Balances">
            ${people.map(
              (p) =>
                html`<li class="row" data-spread key=${p.did + p.cur}>
                  <${Person} did=${p.did} size=${28} />
                  ${owing(p.b, `${p.b > 0 ? 'gets back' : p.did === me ? 'owe' : 'owes'} ${show(Math.abs(p.b), p.cur)}`)}
                </li>`,
            )}
          </ul>
        </section>`
      }
      ${
        entries.length === 0
          ? html`<${Empty}
              shape="receipt"
              colour="lilac"
              title="Nothing on this tab yet"
              text="Add what someone paid, and it splits itself between whoever it was for."
            >
              ${mayAdd && tab && html`<button data-intent="primary" onClick=${() => setAdding({})}>Add an expense</button>`}
            </${Empty}>`
          : html`<section>
              <h2>Spent and paid</h2>
              <ul role="list" aria-label="Spent and paid">
                ${entries.map(
                  (r) =>
                    html`<li key=${r.key}>
                      <button data-intent="open" onClick=${() => setOpenKey(r.key)}>
                        ${isExpense(r) ? html`<${ExpenseLine} expense=${r} names=${names} />` : html`<${SettlementLine} settlement=${r} names=${names} />`}
                      </button>
                    </li>`,
                )}
              </ul>
            </section>`
      }
      ${
        tab &&
        html`<div class="row">
          ${mayRename && !renaming && html`<button data-intent="quiet" onClick=${() => setRenaming(true)}>Rename</button>`}
          ${
            mayDelete &&
            (deleting
              ? html`<button data-intent="danger" onClick=${removeTab}>Delete tab and what's on it</button>
                  <button data-intent="quiet" onClick=${() => setDeleting(false)}>Keep it</button>`
              : html`<button data-intent="quiet" onClick=${() => setDeleting(true)}>Delete tab</button>`)
          }
        </div>`
      }
      ${
        opened &&
        (isExpense(opened)
          ? html`<${ExpenseView}
              expense=${opened}
              items=${about(opened.key)}
              onClose=${() => setOpenKey(null)}
              onEdit=${() => {
                setOpenKey(null);
                setAdding({ expense: opened });
              }}
            />`
          : html`<${SettlementView}
              settlement=${opened}
              items=${about(opened.key)}
              onClose=${() => setOpenKey(null)}
            />`)
      }
      ${
        adding &&
        html`<${ExpenseForm}
          expense=${adding.expense}
          tab=${tab?.key ?? null}
          currency=${currency}
          currencies=${used}
          onCurrency=${remember}
          onClose=${() => setAdding(null)}
        />`
      }
      ${
        settling &&
        html`<${SettleForm}
          initial=${settling}
          tab=${tab?.key ?? null}
          currencies=${used}
          onClose=${() => setSettling(null)}
        />`
      }
    </main>`;
  }

  /** An entry on a tab, as one row: what it was, and what it means for you */
  function EntryLine({ icon, title, meta, side }) {
    return html`<span class="row" data-spread>
      <span class="stack" data-gap="tight">
        <strong>${icon} ${title}</strong>
        <small>${meta}</small>
      </span>
      ${side}
    </span>`;
  }

  function ExpenseLine({ expense, names }) {
    const { total, currency, parts } = partsOf(expense.body);
    const payer = expense.body.paidBy;
    const lent = [...parts].filter(([did]) => did !== payer).reduce((a, [, p]) => a + p, 0);
    const side =
      payer === me
        ? lent > 0 && owing(1, `you lent ${show(lent, currency)}`)
        : parts.has(me)
          ? owing(-1, `you borrowed ${show(parts.get(me), currency)}`)
          : html`<small>not involved</small>`;
    return html`<${EntryLine}
      icon="🧾"
      title=${expense.body.title}
      meta=${`${names(payer)} paid ${show(total, currency)} · ${dateText(dayOf(expense), { day: 'numeric', month: 'short' })}`}
      side=${side}
    />`;
  }

  function SettlementLine({ settlement, names }) {
    const { from, to, amount } = settlement.body;
    const minor = toMinor(amount.amount, amount.currency) ?? 0;
    return html`<${EntryLine}
      icon="💸"
      title=${`${names(from)} paid ${to === me ? 'you' : names(to)}`}
      meta=${[
        show(minor, amount.currency),
        dateText(dayOf(settlement), { day: 'numeric', month: 'short' }),
        settlement.body.note,
      ]
        .filter(Boolean)
        .join(' · ')}
      side=${from === me ? owing(1, `you paid ${show(minor, amount.currency)}`) : to === me ? owing(-1, `you received ${show(minor, amount.currency)}`) : null}
    />`;
  }

  function ExpenseView({ expense, items, onClose, onEdit }) {
    const names = useNames();
    const mayEdit = useCan('edit', expense.key);
    const mayDelete = useCan('delete', expense.key);
    const { total, currency, parts } = partsOf(expense.body);
    const payer = expense.body.paidBy;
    return html`<${Modal} title=${expense.body.title} onClose=${onClose}>
      <div class="stack" data-gap="tight">
        <h1>${show(total, currency)}</h1>
        <small>
          Added by ${names(expense.createdBy)} · ${dateText(dayOf(expense), { day: 'numeric', month: 'long', year: 'numeric' })}
          ${expense.version > 1 ? ' · edited' : ''}
        </small>
      </div>
      <ul role="list">
        <li class="row" data-spread>
          <${Person} did=${payer} size=${28} />
          <span>paid <strong>${show(total, currency)}</strong></span>
        </li>
        ${[...parts].map(
          ([did, part]) =>
            html`<li class="row" data-spread key=${did}>
              <${Person} did=${did} />
              <small>
                ${`${did === payer ? (did === me ? 'your part' : 'their part') : did === me ? 'owe' : 'owes'} ${show(part, currency)}`}
              </small>
            </li>`,
        )}
      </ul>
      ${expense.body.note && html`<p>${expense.body.note}</p>`}
      ${
        (mayEdit || mayDelete) &&
        html`<div class="row">
          ${mayEdit && html`<button onClick=${onEdit}>Edit</button>`}
          ${
            mayDelete &&
            html`<button
              data-intent="danger"
              onClick=${async () => {
                await minca.remove(expense.key);
                // What put it on a tab goes with it; one that can't go points at nothing, harmlessly.
                await Promise.allSettled(items.map((i) => minca.remove(i.key)));
                onClose();
              }}
            >
              Delete
            </button>`
          }
        </div>`
      }
      ${minca.collections.includes('std.comment') && html`<${Comments} about=${expense} />`}
    </${Modal}>`;
  }

  function SettlementView({ settlement, items, onClose }) {
    const names = useNames();
    const mayDelete = useCan('delete', settlement.key);
    const { from, to, amount, note } = settlement.body;
    return html`<${Modal} title="Payment" onClose=${onClose}>
      <div class="stack" data-gap="tight">
        <h1>${show(toMinor(amount.amount, amount.currency) ?? 0, amount.currency)}</h1>
        <p>${names(from)} paid ${to === me ? 'you' : names(to)}</p>
        <small>${dateText(dayOf(settlement), { day: 'numeric', month: 'long', year: 'numeric' })}</small>
      </div>
      ${note && html`<p>${note}</p>`}
      ${
        mayDelete &&
        html`<div class="row">
          <button
            data-intent="danger"
            onClick=${async () => {
              await minca.remove(settlement.key);
              await Promise.allSettled(items.map((i) => minca.remove(i.key)));
              onClose();
            }}
          >
            Delete
          </button>
        </div>`
      }
    </${Modal}>`;
  }

  const MODES = [
    ['equal', 'Equally'],
    ['exact', 'Exact amounts'],
    ['percent', 'Percentages'],
    ['shares', 'Shares'],
  ];

  /** Adds an expense, or changes one: what, how much, who paid, and how it splits */
  function ExpenseForm({ expense, tab, currency: preferred, currencies, onCurrency, onClose }) {
    const people = usePeople() ?? [];
    const was = expense?.body;
    const wasParts = was ? partsOf(was).parts : null;
    const everyone = [
      ...new Set([me, ...people.map((p) => p.did), ...(was ? [was.paidBy, ...wasParts.keys()] : [])]),
    ];
    const [title, setTitle] = useState(was?.title ?? '');
    const [currency, setCurrency] = useState(was?.amount.currency ?? preferred);
    const [amount, setAmount] = useState(was?.amount.amount ?? '');
    const [paidBy, setPaidBy] = useState(was?.paidBy ?? me);
    const [date, setDate] = useState(was?.date ?? today());
    const [note, setNote] = useState(was?.note ?? '');
    const [mode, setMode] = useState(was ? 'exact' : 'equal');
    // Who is in it, and what each typed for their part (exact, percent or shares)
    // A new expense is everyone's until someone is ticked off: people may still be arriving.
    const [picked, setPicked] = useState(() => (wasParts ? new Set(wasParts.keys()) : null));
    const inIt = picked ?? new Set(everyone);
    const [typed, setTyped] = useState(() =>
      wasParts ? Object.fromEntries([...wasParts].map(([d, p]) => [d, toDecimal(p, currency)])) : {},
    );
    const [error, setError] = useState(null);
    const [busy, setBusy] = useState(false);
    // autofocus only works on what the page loads with; and the dialog takes focus itself once drawn
    const first = useRef(null);
    useEffect(() => {
      const frame = requestAnimationFrame(() => first.current?.focus());
      return () => cancelAnimationFrame(frame);
    }, []);

    const total = toMinor(amount, currency);
    const chosen = everyone.filter((d) => inIt.has(d));
    const number = (did) => Number(String(typed[did] ?? '').replace(',', '.')) || 0;
    const percent = chosen.reduce((a, d) => a + number(d), 0);
    const parts = (() => {
      if (total === null) return null;
      if (mode === 'equal')
        return allocate(
          total,
          chosen.map(() => 1),
        );
      if (mode === 'exact') return chosen.map((d) => toMinor(typed[d] || '0', currency) ?? 0);
      const weights = chosen.map(number);
      // Percentages short of 100 show as typed, not stretched to fill the total
      const covered = mode === 'percent' ? Math.min(percent, 100) / 100 : 1;
      return allocate(Math.round(total * covered), weights);
    })();
    const sum = parts ? parts.reduce((a, b) => a + b, 0) : 0;
    const problem = !title.trim()
      ? 'What was it for?'
      : !total
        ? 'How much was it?'
        : chosen.length === 0
          ? 'Who is it split between?'
          : mode === 'exact' && sum !== total
            ? `The parts add up to ${show(sum, currency)}, ${show(Math.abs(total - sum), currency)} ${sum < total ? 'short' : 'over'}`
            : mode === 'percent' && Math.abs(percent - 100) > 0.001
              ? `The percentages add up to ${percent}%, not 100%`
              : mode === 'shares' && sum !== total
                ? 'Give someone at least one share'
                : null;

    const save = async (event) => {
      event.preventDefault();
      if (problem) return setError(problem);
      setBusy(true);
      setError(null);
      const split = chosen
        .map((did, i) => ({ did, share: toDecimal(parts[i], currency) }))
        .filter((s, i) => parts[i] > 0);
      const body = {
        title: title.trim(),
        amount: { amount: toDecimal(total, currency), currency },
        paidBy,
        split,
        owedBy: split.map((s) => s.did).filter((d) => d !== paidBy),
        date,
        ...(note.trim() ? { note: note.trim() } : {}),
      };
      try {
        if (expense) await minca.update(expense.key, body);
        else await putOn(tab, EXPENSE, body);
        onCurrency(currency);
        onClose();
      } catch (e) {
        setError(e.message);
        setBusy(false);
      }
    };

    const toggle = (did) => {
      const next = new Set(inIt);
      next.has(did) ? next.delete(did) : next.add(did);
      setPicked(next);
    };

    return html`<${Modal} title=${expense ? 'Edit expense' : 'Add an expense'} onClose=${onClose}>
      <form class="stack" data-gap="loose" onSubmit=${save}>
        <label>
          What it was for
          <input
            value=${title}
            onInput=${(e) => setTitle(e.currentTarget.value)}
            placeholder="Dinner, rent, tickets…"
            ref=${first}
          />
        </label>
        <${Money} currency=${currency} currencies=${currencies} onCurrency=${setCurrency} amount=${amount} onAmount=${setAmount} />
        <div class="grid">
          <label>
            Paid by
            <select value=${paidBy} onChange=${(e) => setPaidBy(e.currentTarget.value)}>
              ${everyone.map((d) => html`<option key=${d} value=${d}>${nameIn(people, d)}</option>`)}
            </select>
          </label>
          <label>
            Date
            <input type="date" value=${date} onInput=${(e) => setDate(e.currentTarget.value || today())} />
          </label>
        </div>
        <fieldset>
          <legend>Split</legend>
          <div role="tablist">
            ${MODES.map(
              ([id, label]) =>
                html`<button
                  type="button"
                  role="tab"
                  key=${id}
                  aria-selected=${mode === id}
                  onClick=${() => setMode(id)}
                >
                  ${label}
                </button>`,
            )}
          </div>
          <ul role="list">
            ${everyone.map((did) => {
              const at = chosen.indexOf(did);
              return html`<li class="stack" data-gap="tight" key=${did}>
                <div class="row" data-spread>
                  <label>
                    <input type="checkbox" checked=${inIt.has(did)} onChange=${() => toggle(did)} />
                    <${Person} did=${did} size=${24} />
                  </label>
                  <small>${at >= 0 && parts ? show(parts[at], currency) : ''}</small>
                </div>
                ${
                  mode !== 'equal' &&
                  inIt.has(did) &&
                  html`<input
                    value=${typed[did] ?? ''}
                    inputmode="decimal"
                    placeholder=${mode === 'exact' ? '0.00' : mode === 'percent' ? '%' : '1'}
                    aria-label=${`${nameIn(people, did)}'s part`}
                    onInput=${(e) => setTyped({ ...typed, [did]: e.currentTarget.value })}
                  />`
                }
              </li>`;
            })}
          </ul>
        </fieldset>
        <label>
          Notes
          <textarea
            rows="2"
            value=${note}
            onInput=${(e) => setNote(e.currentTarget.value)}
            placeholder="Optional"
          ></textarea>
        </label>
        ${error && html`<p role="alert">${error}</p>`}
        ${!error && problem && total ? html`<small>${problem}</small>` : null}
        <div class="row" data-spread>
          <button type="button" data-intent="quiet" onClick=${onClose}>Cancel</button>
          <button type="submit" data-intent="primary" disabled=${busy}>${busy ? 'Saving…' : 'Save'}</button>
        </div>
      </form>
    </${Modal}>`;
  }

  /** A currency and an amount in it, side by side */
  function Money({ currency, currencies, onCurrency, amount, onAmount }) {
    return html`<div class="grid">
      <label>
        Currency
        <select value=${currency} onChange=${(e) => onCurrency(e.currentTarget.value)}>
          ${currencies.map((c) => html`<option key=${c} value=${c}>${c}</option>`)}
        </select>
      </label>
      <label>
        Amount
        <input
          value=${amount}
          inputmode="decimal"
          onInput=${(e) => onAmount(e.currentTarget.value)}
          placeholder="0.00"
        />
      </label>
    </div>`;
  }

  /** A payment from one person to another: settling up all or part of what they owe */
  function SettleForm({ initial, tab, currencies, onClose }) {
    const people = usePeople() ?? [];
    const everyone = [
      ...new Set([me, ...people.map((p) => p.did), initial.from, initial.to].filter(Boolean)),
    ];
    const [from, setFrom] = useState(initial.from ?? me);
    const [to, setTo] = useState(initial.to ?? everyone.find((d) => d !== (initial.from ?? me)) ?? '');
    const [currency, setCurrency] = useState(initial.currency);
    const [amount, setAmount] = useState(initial.minor ? toDecimal(initial.minor, initial.currency) : '');
    const [error, setError] = useState(null);
    const minor = toMinor(amount, currency);
    const problem = !to || from === to ? 'Pick two different people' : !minor ? 'How much was paid?' : null;
    return html`<${Modal} title="Settle up" onClose=${onClose}>
      <form
        class="stack"
        data-gap="loose"
        onSubmit=${async (event) => {
          event.preventDefault();
          if (problem) return setError(problem);
          try {
            await putOn(tab, SETTLEMENT, {
              from,
              to,
              amount: { amount: toDecimal(minor, currency), currency },
              date: today(),
            });
            onClose();
          } catch (e) {
            setError(e.message);
          }
        }}
      >
        <div class="row">
          <${Avatar} did=${from} size=${48} round />
          <span aria-hidden="true">→</span>
          ${to && html`<${Avatar} did=${to} size=${48} round />`}
        </div>
        <div class="grid">
          <label>
            Who paid
            <select value=${from} onChange=${(e) => setFrom(e.currentTarget.value)}>
              ${everyone.map((d) => html`<option key=${d} value=${d}>${nameIn(people, d)}</option>`)}
            </select>
          </label>
          <label>
            To
            <select value=${to} onChange=${(e) => setTo(e.currentTarget.value)}>
              ${everyone.map((d) => html`<option key=${d} value=${d}>${nameIn(people, d)}</option>`)}
            </select>
          </label>
        </div>
        <${Money} currency=${currency} currencies=${currencies} onCurrency=${setCurrency} amount=${amount} onAmount=${setAmount} />
        ${error && html`<p role="alert">${error}</p>`}
        <div class="row" data-spread>
          <button type="button" data-intent="quiet" onClick=${onClose}>Cancel</button>
          <button type="submit" data-intent="primary">Record payment</button>
        </div>
      </form>
    </${Modal}>`;
  }

  /** A row to type a name into: Enter or Save makes it; Escape leaves it, where it can be left */
  function AddRow({ placeholder, onAdd, initial = '', onCancel }) {
    const [text, setText] = useState(initial);
    const [busy, setBusy] = useState(false);
    const submit = async () => {
      const value = text.trim();
      if (!value || busy) return;
      setBusy(true);
      try {
        await onAdd(value);
        setText('');
      } finally {
        setBusy(false);
      }
    };
    return html`<form
      class="stack"
      onSubmit=${(e) => {
        e.preventDefault();
        submit();
      }}
    >
      <input
        value=${text}
        placeholder=${placeholder}
        aria-label=${placeholder}
        maxlength="200"
        autofocus=${!!onCancel}
        enterkeyhint="done"
        onInput=${(e) => setText(e.currentTarget.value)}
        onKeyDown=${(e) => e.key === 'Escape' && onCancel?.()}
      />
      ${
        text.trim() &&
        html`<div class="row">
          <button type="submit" data-intent="primary" disabled=${busy}>Save</button>
        </div>`
      }
    </form>`;
  }

  render(html`<${Bills} />`);
</script>
