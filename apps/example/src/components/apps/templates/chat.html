<!-- Chat: std.message as one room, with "@" mentions, files (std.file) dropped anywhere on it, pasted or picked, and anything in the space shared with "/". -->
<style>
  html,
  body {
    height: 100%;
  }
  body {
    padding: 0;
  }
  #app {
    height: 100%;
    display: flex;
    flex-direction: column;
  }
  .messages {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 16px 16px 8px;
  }
  .line {
    display: flex;
    gap: 10px;
    padding: 2px 8px;
    margin: 0 -8px;
    border-radius: var(--minca-radius-md);
  }
  .line.starts {
    margin-top: 10px;
  }
  .line.for-me {
    background: var(--minca-accent-soft);
  }
  .line.shown {
    outline: 2px solid var(--minca-accent);
  }
  .line:hover {
    background: var(--minca-sunken);
  }
  .line .face {
    width: 28px;
    flex-shrink: 0;
  }
  .line .text {
    white-space: pre-wrap;
    word-break: break-word;
  }
  .line .delete {
    visibility: hidden;
    align-self: flex-start;
    min-height: 24px;
    padding: 0 8px;
    font-size: 12px;
  }
  .line:hover .delete,
  .line:focus-within .delete {
    visibility: visible;
  }
  .composer {
    padding: 8px 16px 16px;
    border-top: 1px solid var(--minca-line);
  }
  .drop {
    position: fixed;
    inset: 8px;
    z-index: 10;
    display: grid;
    place-items: center;
    border: 2px dashed var(--minca-accent);
    border-radius: var(--minca-radius-lg);
    background: var(--minca-accent-soft);
    color: var(--minca-accent);
    font-weight: 600;
    pointer-events: none;
  }
  .pending {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px;
    margin-bottom: 8px;
  }
  .pending .thumb {
    position: relative;
    width: 48px;
    height: 48px;
    min-height: 0;
    padding: 0;
    overflow: hidden;
    border-radius: var(--minca-radius-md);
  }
  .pending .thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .pending .thumb span {
    position: absolute;
    top: 2px;
    right: 2px;
    width: 16px;
    height: 16px;
    line-height: 16px;
    font-size: 10px;
    border-radius: 50%;
    color: #fff;
    background: rgb(0 0 0 / 0.6);
  }
  /* A shared record sits as wide as it says, not across the whole line */
  .shared {
    align-self: flex-start;
    max-width: 100%;
  }
</style>
<script>
  const { html, render, useState, useEffect, useRef, useRecords, useCan, usePeople, useShown } = ui;
  const { Avatar, Person, MentionInput, MentionText, mentionsIn, Attachments, attach, ago, Record } = ui;
  const MESSAGE = 'std.message';
  const me = minca.me.did;
  /** Messages from one person this close together read as one run, under one name */
  const RUN_MS = 5 * 60 * 1000;
  /** "/" alone, or "/poll": share something, found by what was typed after it */
  const SLASH = /^\/(\S*)$/;

  /** A record in a few words, for a message that shares it and says nothing else */
  const titleOf = (record) => {
    const body = record.body ?? {};
    for (const field of ['title', 'name', 'question', 'label', 'text'])
      if (typeof body[field] === 'string' && body[field].trim()) return body[field].trim().slice(0, 200);
    return record.collection;
  };

  /** What a message shares, read through its link, and opened in the app that shows it */
  function Shared({ message }) {
    const [record, setRecord] = useState(undefined);
    useEffect(() => {
      const load = () => minca.get(message.key, { link: 'shares' }).then(setRecord, () => setRecord(null));
      load();
      return minca.onChange(load);
    }, [message.key]);
    if (record === undefined) return null;
    if (record === null) return html`<p class="faint">Shared something that isn't here.</p>`;
    return html`<div class="shared">
      <${Record} record=${record} onOpen=${() => minca.open({ record: message.key, link: 'shares' })} />
    </div>`;
  }

  function Chat() {
    const messages = useRecords(MESSAGE);
    const maySend = useCan('create', MESSAGE);
    const list = useRef(null);
    const count = messages?.length ?? 0;
    // A message opened from elsewhere, like the one a file was shared on: scrolled to and marked a moment.
    const shown = useShown();
    const [marked, setMarked] = useState(null);
    // New messages land at the bottom, so keep it in view as they arrive, unless one was opened.
    useEffect(() => {
      if (!marked) list.current?.scrollTo({ top: list.current.scrollHeight });
    }, [count]);
    useEffect(() => {
      if (!shown || !messages?.some((m) => m.key === shown.key)) return;
      setMarked(shown.key);
      document.getElementById(`m-${shown.key}`)?.scrollIntoView({ block: 'center' });
      const done = setTimeout(() => setMarked(null), 2500);
      return () => clearTimeout(done);
    }, [shown, count > 0]);
    if (!messages) return null;
    return html`
      <div class="messages" ref=${list}>
        ${messages.length === 0 && html`<p class="empty">No messages yet. Say hello.</p>`}
        ${messages.map((m, i) => {
          const before = messages[i - 1];
          const starts =
            !before ||
            before.createdBy !== m.createdBy ||
            Date.parse(m.createdAt) - Date.parse(before.createdAt) > RUN_MS;
          return html`<${Line} key=${m.key} message=${m} starts=${starts} marked=${m.key === marked} />`;
        })}
      </div>
      ${
        maySend
          ? html`<${Composer} />`
          : html`<p class="composer muted">Your role here doesn't let you send messages.</p>`
      }
    `;
  }

  /** One message: its writer when it starts a run, what it says, what is attached, and Delete for your own */
  function Line({ message, starts, marked }) {
    const forMe = message.body.mentions?.includes(me);
    return html`<div
      id=${`m-${message.key}`}
      class=${`line${starts ? ' starts' : ''}${forMe ? ' for-me' : ''}${marked ? ' shown' : ''}`}
    >
      <div class="face">${starts && html`<${Avatar} did=${message.createdBy} size=${28} round />`}</div>
      <div class="stack" style="flex: 1; min-width: 0; gap: 4px">
        ${
          starts &&
          html`<div>
            <${Person} did=${message.createdBy} face=${false} />
            <span class="faint"> · ${ago(message.createdAt)}</span>
          </div>`
        }
        <p class="text"><${MentionText} text=${message.body.text} /></p>
        ${message.links.some((link) => link.rel === 'shares') && html`<${Shared} message=${message} />`}
        <${Attachments} about=${message.key} />
      </div>
      ${
        message.mine &&
        html`<button class="delete" data-variant="ghost" onClick=${() => minca.remove(message.key)}>
          Delete
        </button>`
      }
    </div>`;
  }

  /** A file waiting to be sent: a small picture of it if it is one, else its name; clicked, it comes off */
  function Pending({ file, onRemove }) {
    const [url, setUrl] = useState(null);
    useEffect(() => {
      if (!file.type.startsWith('image/')) return;
      const made = URL.createObjectURL(file);
      setUrl(made);
      return () => URL.revokeObjectURL(made);
    }, [file]);
    if (url)
      return html`<button type="button" class="thumb" title=${`Take ${file.name} off`} onClick=${onRemove}>
        <img src=${url} alt=${file.name} />
        <span aria-hidden="true">✕</span>
      </button>`;
    return html`<button type="button" class="chip" title="Take it off" onClick=${onRemove}>
      📎 ${file.name} ✕
    </button>`;
  }

  /** The box: text with "@" mentions, and files dropped anywhere on the screen, pasted or picked */
  function Composer() {
    const people = usePeople();
    const [draft, setDraft] = useState('');
    const [files, setFiles] = useState([]);
    // A record the person chose to share, sent with the next message
    const [sharing, setSharing] = useState(null);
    const [dropping, setDropping] = useState(false);
    const [busy, setBusy] = useState(false);
    const [error, setError] = useState(null);
    const picker = useRef(null);
    const add = (list) => list?.length && setFiles((was) => [...was, ...list]);

    // Files dropped anywhere on the screen, or pasted wherever the focus is, wait in the box.
    useEffect(() => {
      // Entering a child leaves its parent, so count rather than flicker.
      let depth = 0;
      const carriesFiles = (event) => event.dataTransfer?.types.includes('Files');
      const enter = (event) => {
        if (!carriesFiles(event)) return;
        event.preventDefault();
        depth += 1;
        setDropping(true);
      };
      const over = (event) => carriesFiles(event) && event.preventDefault();
      const leave = (event) => {
        if (!carriesFiles(event)) return;
        depth = Math.max(0, depth - 1);
        if (depth === 0) setDropping(false);
      };
      const done = () => {
        depth = 0;
        setDropping(false);
      };
      const drop = (event) => {
        if (!carriesFiles(event)) return;
        event.preventDefault();
        done();
        add([...event.dataTransfer.files]);
      };
      const paste = (event) => {
        // A copied screenshot is a file among the clipboard's items, whichever list the browser puts it in.
        const data = event.clipboardData;
        const pasted = data?.files.length
          ? [...data.files]
          : [...(data?.items ?? [])].map((item) => item.kind === 'file' && item.getAsFile()).filter(Boolean);
        if (!pasted.length) return;
        event.preventDefault();
        add(pasted);
      };
      const on = { dragenter: enter, dragover: over, dragleave: leave, drop, dragend: done, paste };
      for (const [name, listener] of Object.entries(on)) document.addEventListener(name, listener);
      addEventListener('blur', done);
      return () => {
        for (const [name, listener] of Object.entries(on)) document.removeEventListener(name, listener);
        removeEventListener('blur', done);
      };
    }, []);

    // The person chooses in the app around this screen; this screen gets only what they choose.
    const share = async (text = '') => {
      setError(null);
      try {
        const picked = await minca.pick({ text });
        if (picked) setSharing(picked);
      } catch (e) {
        setError(e.message);
      }
    };

    const send = async () => {
      const slash = SLASH.exec(draft.trim());
      if (slash && !files.length) {
        setDraft('');
        return share(slash[1]);
      }
      const text =
        draft.trim() ||
        (sharing ? titleOf(sharing) : '') ||
        files.map((file) => `📎 ${file.name}`).join('\n');
      if (!text || busy) return;
      setBusy(true);
      setError(null);
      try {
        const mentions = mentionsIn(draft, people);
        const sent = await minca.put(
          MESSAGE,
          { text, ...(mentions.length ? { mentions } : {}) },
          sharing ? { links: [{ rel: 'shares', to: sharing.key }] } : {},
        );
        await attach(sent.key, files);
        setDraft('');
        setFiles([]);
        setSharing(null);
      } catch (e) {
        setError(e.message);
      } finally {
        setBusy(false);
      }
    };

    return html`<form
      class="composer"
      onSubmit=${(event) => {
        event.preventDefault();
        send();
      }}
    >
      ${dropping && html`<div class="drop">Drop files to attach</div>`}
      ${
        sharing &&
        html`<div class="pending">
          <button type="button" class="chip" title="Don't share it" onClick=${() => setSharing(null)}>
            ↗ ${titleOf(sharing)} ✕
          </button>
        </div>`
      }
      ${
        files.length > 0 &&
        html`<div class="pending">
          ${files.map(
            (file, i) =>
              html`<${Pending}
                key=${`${file.name}:${i}`}
                file=${file}
                onRemove=${() => setFiles(files.filter((_, j) => j !== i))}
              />`,
          )}
        </div>`
      }
      <div class="row">
        <button
          type="button"
          aria-label="Attach files"
          title="Attach files"
          onClick=${() => picker.current?.click()}
        >
          +
        </button>
        <button
          type="button"
          aria-label="Share something from this space"
          title="Share something from this space"
          onClick=${() => share()}
        >
          /
        </button>
        <input
          ref=${picker}
          type="file"
          multiple
          hidden
          onChange=${(event) => {
            add([...event.currentTarget.files]);
            event.currentTarget.value = '';
          }}
        />
        <${MentionInput}
          value=${draft}
          onChange=${setDraft}
          placeholder="Message… @ to mention, / to share"
          aria-label="Message"
        />
        <button
          type="submit"
          data-variant="primary"
          disabled=${busy || (!draft.trim() && !files.length && !sharing)}
        >
          ${busy ? 'Sending…' : 'Send'}
        </button>
      </div>
      ${error && html`<p class="error">${error}</p>`}
    </form>`;
  }

  render(html`<${Chat} />`);
</script>
