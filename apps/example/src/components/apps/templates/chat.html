<!-- Chat: std.message as one room, with "@" mentions, replies, emoji reactions (std.reaction), files (std.file) dropped anywhere on it, pasted or picked, GIFs from GIPHY once the space has a key, and anything in the space shared with "+" or "/". -->
<script>
  const { html, render, useState, useEffect, useRef, useRecords, useCan, usePeople, useShown, useShare } = ui;
  const { Person, MentionInput, MentionText, mentionsIn, Attachments, attach, usePresence } = ui;
  const { Shared, Sharing, recordTitle, AddMenu, EmojiPicker, Reactions, react, Modal, Empty } = ui;
  const MESSAGE = 'std.message';
  const me = minca.me.did;
  const has = (collection) => minca.collections.includes(collection);
  /** Messages from one person this close together read as one run, under one name */
  const RUN_MS = 5 * 60 * 1000;
  /** How long someone shows as typing after their last key */
  const TYPING_MS = 3000;

  const dayOf = (iso) => new Date(iso).toDateString();
  const dayLabel = (iso) => {
    const day = new Date(iso);
    const today = new Date();
    const yesterday = new Date(today.getTime() - 86400000);
    if (day.toDateString() === today.toDateString()) return 'Today';
    if (day.toDateString() === yesterday.toDateString()) return 'Yesterday';
    return day.toLocaleDateString(undefined, {
      weekday: 'long',
      day: 'numeric',
      month: 'long',
      ...(day.getFullYear() === today.getFullYear() ? {} : { year: 'numeric' }),
    });
  };
  const timeOf = (iso) => new Date(iso).toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
  const linkOf = (r, rel) => r.links.find((l) => l.rel === rel)?.to;
  const nameIn = (people, did) =>
    did === me ? 'You' : (people.find((p) => p.did === did)?.name ?? 'Someone');

  // GIFs come from GIPHY, with the key someone who may add apps gave in the app's settings; without one there are none.
  // What is sent is the GIF itself, kept in the space as a file, so it shows for everyone and stays.
  const GIPHY = 'https://api.giphy.com/v1/gifs';
  const giphyKey = minca.settings.giphy;
  // GIPHY's numbered media hosts serve the same paths as this one, the only one the app reaches.
  const giphyMedia = (url) => url.replace(/^https:\/\/media\d\.giphy\.com\//, 'https://media.giphy.com/');

  /** GIFs for what was typed, or trending ones before anything is */
  async function findGifs(query) {
    const params = new URLSearchParams({ api_key: giphyKey, limit: '24', rating: 'pg-13' });
    if (query) params.set('q', query);
    const response = await fetch(`${GIPHY}/${query ? 'search' : 'trending'}?${params}`);
    if (response.status === 401 || response.status === 403)
      throw new Error("GIPHY didn't take the space's key.");
    if (!response.ok) throw new Error(`GIPHY answered ${response.status}.`);
    const { data } = await response.json();
    return data
      .filter((gif) => gif.images?.fixed_height?.url)
      .map((gif) => ({
        id: gif.id,
        title: gif.title?.replace(/\s+GIF\b.*$/i, '').trim() || 'GIF',
        preview: giphyMedia((gif.images.fixed_width_small ?? gif.images.fixed_height).url),
        url: giphyMedia(gif.images.fixed_height.url),
      }));
  }

  /** A GIF's bytes, as a file to attach */
  async function gifFile(gif) {
    const response = await fetch(gif.url);
    if (!response.ok) throw new Error(`Couldn't fetch the GIF (${response.status}).`);
    return new File([await response.blob()], `${gif.title}.gif`, { type: 'image/gif' });
  }

  function Chat() {
    const messages = useRecords(MESSAGE);
    const maySend = useCan('create', MESSAGE);
    const people = usePeople();
    const list = useRef(null);
    // Whether the list was at its end before what just arrived: only then does it follow along.
    const atEnd = useRef(true);
    const count = messages?.length ?? 0;
    const [replying, setReplying] = useState(null);
    const [editing, setEditing] = useState(null);
    // Who is typing, as each screen says it live; kept nowhere
    const [typing, setTyping] = useState(false);
    const others = usePresence({ typing });
    const typists = [...new Set(others.filter((o) => o.state?.typing && o.did !== me).map((o) => o.did))];
    // A message opened from elsewhere, like the one a file was shared on: scrolled to and marked a moment.
    const shown = useShown();
    const [marked, setMarked] = useState(null);
    useEffect(() => {
      const last = messages?.at(-1);
      if (!marked && (atEnd.current || last?.mine))
        list.current?.scrollTo({ top: list.current.scrollHeight });
    }, [count]);
    useEffect(() => {
      if (!shown || !messages?.some((m) => m.key === shown.key)) return;
      jumpTo(shown.key);
    }, [shown, count > 0]);
    if (!messages) return null;

    function jumpTo(key) {
      setMarked(key);
      document.getElementById(`m-${key}`)?.scrollIntoView({ block: 'center', behavior: 'smooth' });
      setTimeout(() => setMarked((was) => (was === key ? null : was)), 2500);
    }
    const byKey = new Map(messages.map((m) => [m.key, m]));
    // Each day a section, and in it each run of one person's messages a stack of its own
    const days = [];
    messages.forEach((m, i) => {
      const before = messages[i - 1];
      const newDay = !before || dayOf(before.createdAt) !== dayOf(m.createdAt);
      const starts =
        newDay ||
        before.createdBy !== m.createdBy ||
        !!linkOf(m, 'replyTo') ||
        Date.parse(m.createdAt) - Date.parse(before.createdAt) > RUN_MS;
      if (newDay) days.push({ key: m.key, label: dayLabel(m.createdAt), runs: [] });
      const { runs } = days.at(-1);
      if (starts) runs.push({ key: m.key, lines: [] });
      runs.at(-1).lines.push({ m, starts });
    });

    return html`<main data-fill>
      <div
        class="stack"
        data-gap="loose"
        ref=${list}
        onScroll=${(event) => {
          const el = event.currentTarget;
          atEnd.current = el.scrollHeight - el.scrollTop - el.clientHeight < 80;
        }}
      >
        ${
          messages.length === 0 &&
          html`<${Empty}
            shape="bubble"
            colour="cobalt"
            title="No messages yet"
            text="Say hello to everyone here."
          />`
        }
        ${days.map(
          (day) =>
            html`<section key=${day.key}>
              <h3>${day.label}</h3>
              ${day.runs.map(
                (run) =>
                  html`<div class="stack" data-gap="tight" key=${run.key}>
                    ${run.lines.map(({ m, starts }) => {
                      const to = linkOf(m, 'replyTo');
                      return html`<${Line}
                        key=${m.key}
                        message=${m}
                        starts=${starts}
                        marked=${m.key === marked}
                        replyTo=${to ? (byKey.get(to) ?? { missing: true }) : null}
                        people=${people}
                        editing=${editing === m.key}
                        onEdit=${(on) => setEditing(on ? m.key : null)}
                        onReply=${maySend ? () => setReplying(m) : null}
                        onJump=${jumpTo}
                      />`;
                    })}
                  </div>`,
              )}
            </section>`,
        )}
      </div>
      ${
        maySend
          ? html`<${Composer}
              replying=${replying}
              onReplied=${() => setReplying(null)}
              typists=${typists}
              people=${people}
              onTyping=${setTyping}
            />`
          : html`<p><small>Your role here doesn't let you send messages.</small></p>`
      }
    </main>`;
  }

  /**
   * One message: its writer when it starts a run, else its time on hover; what
   * it answers, says, shares and has attached; its reactions; and, on hover,
   * react, reply, and edit or delete your own.
   */
  function Line({ message, starts, marked, replyTo, people, editing, onEdit, onReply, onJump }) {
    const text = typeof message.body.text === 'string' ? message.body.text : '';
    const [draft, setDraft] = useState(text);
    const box = useRef(null);
    useEffect(() => {
      if (editing) box.current?.querySelector('input, textarea')?.focus();
    }, [editing]);
    const edited = Date.parse(message.updatedAt) - Date.parse(message.createdAt) > 1000;
    const save = async () => {
      const next = draft.trim();
      if (next && next !== text) {
        const mentions = mentionsIn(next, people);
        const { mentions: _, ...rest } = message.body;
        await minca.update(message.key, { ...rest, text: next, ...(mentions.length ? { mentions } : {}) });
      }
      onEdit(false);
    };
    return html`<div
      id=${`m-${message.key}`}
      class="stack"
      data-gap="tight"
      data-marked=${marked}
      title=${starts ? undefined : timeOf(message.createdAt)}
    >
      ${
        replyTo &&
        html`<small class="truncate">
          ${
            replyTo.missing
              ? '↪ A message that is gone'
              : html`<a
                    href=${`#m-${replyTo.key}`}
                    onClick=${(event) => {
                      event.preventDefault();
                      onJump(replyTo.key);
                    }}
                    >${`↪ ${nameIn(people, replyTo.createdBy)}`}</a
                  >${`: ${replyTo.body.text}`}`
          }
        </small>`
      }
      ${
        starts &&
        html`<div class="row" data-gap="tight">
          <${Person} did=${message.createdBy} size=${24} />
          <small>${timeOf(message.createdAt)}</small>
        </div>`
      }
      ${
        editing
          ? html`<form
              ref=${box}
              class="stack"
              data-gap="tight"
              onKeyDown=${(event) => event.key === 'Escape' && onEdit(false)}
              onSubmit=${(event) => {
                event.preventDefault();
                save();
              }}
            >
              <${MentionInput} value=${draft} onChange=${setDraft} aria-label="Edit the message" />
              <small>Enter to save, Escape to cancel</small>
            </form>`
          : html`<p><${MentionText} text=${text} />${edited && html`<small> (edited)</small>`}</p>`
      }
      <${Shared} from=${message} />
      <${Attachments} about=${message.key} />
      ${has('std.reaction') && html`<${Reactions} about=${message} />`}
      <div data-actions>
        ${!editing && has('std.reaction') && html`<${EmojiPicker} label="React" onPick=${(emoji) => react(message, emoji).catch(() => {})} />`}
        ${!editing && onReply && html`<button data-intent="ghost" data-icon title="Reply" aria-label="Reply" onClick=${onReply}>↩</button>`}
        ${
          !editing &&
          message.mine &&
          html`<button
              data-intent="ghost"
              data-icon
              title="Edit"
              aria-label="Edit"
              onClick=${() => {
                setDraft(text);
                onEdit(true);
              }}
            >
              ✎
            </button>
            <button
              data-intent="ghost"
              data-icon
              title="Delete"
              aria-label="Delete"
              onClick=${() => minca.remove(message.key)}
            >
              🗑
            </button>`
        }
      </div>
    </div>`;
  }

  /** A file waiting to be sent, by name; its ✕ takes it off */
  function Pending({ file, onRemove }) {
    return html`<span class="tag">
      <span class="truncate">${file.name}</span>
      <button
        type="button"
        data-intent="ghost"
        data-icon
        aria-label=${`Don't attach ${file.name}`}
        onClick=${onRemove}
      >
        ✕
      </button>
    </span>`;
  }

  /**
   * The GIF button, and over the screen, while open, a search of GIPHY to pick one from. It sits inside the message
   * form, so Enter in it sends nothing. Escape or a press outside closes it.
   */
  function GifPicker({ onPick, disabled }) {
    const [open, setOpen] = useState(false);
    const [query, setQuery] = useState('');
    const [gifs, setGifs] = useState(null);
    const [error, setError] = useState(null);
    const [sending, setSending] = useState(null);
    const box = useRef(null);
    const search = useRef(null);
    useEffect(() => {
      if (!open) return;
      search.current?.focus();
      const away = (event) => {
        const outside = event.target instanceof Node && !box.current?.contains(event.target);
        if (event instanceof KeyboardEvent ? event.key === 'Escape' : outside) setOpen(false);
      };
      addEventListener('pointerdown', away);
      addEventListener('keydown', away);
      return () => {
        removeEventListener('pointerdown', away);
        removeEventListener('keydown', away);
      };
    }, [open]);
    useEffect(() => {
      if (!open) return;
      let current = true;
      const wait = setTimeout(() => {
        findGifs(query.trim()).then(
          (found) => current && (setGifs(found), setError(null)),
          (e) => current && setError(e.message),
        );
      }, 300);
      return () => {
        current = false;
        clearTimeout(wait);
      };
    }, [open, query]);
    const pick = async (gif) => {
      setSending(gif.id);
      try {
        await onPick(gif);
        setOpen(false);
      } finally {
        setSending(null);
      }
    };
    return html`<div ref=${box}>
      <button
        type="button"
        data-intent="ghost"
        data-icon
        title="Send a GIF"
        aria-label="Send a GIF"
        aria-expanded=${open}
        disabled=${disabled}
        onClick=${() => setOpen(!open)}
      >
        <small>GIF</small>
      </button>
      ${
        open &&
        html`<${Modal} title="GIFs" onClose=${() => setOpen(false)}>
          <input
            type="search"
            value=${query}
            onInput=${(event) => setQuery(event.currentTarget.value)}
            onKeyDown=${(event) => event.key === 'Enter' && event.preventDefault()}
            placeholder="Search GIPHY"
            aria-label="Search GIFs"
            ref=${search}
          />
          ${error && html`<p role="alert">${error}</p>`}
          ${gifs?.length === 0 && html`<p><small>No GIFs for that.</small></p>`}
          <div class="grid">
            ${(gifs ?? []).map(
              (gif) =>
                html`<button
                  type="button"
                  data-intent="open"
                  key=${gif.id}
                  title=${gif.title}
                  aria-label=${`Send ${gif.title}`}
                  aria-busy=${sending === gif.id}
                  disabled=${sending !== null}
                  onClick=${() => pick(gif)}
                >
                  <img src=${gif.preview} alt=${gif.title} loading="lazy" />
                </button>`,
            )}
          </div>
          <small>Powered by GIPHY</small>
        </${Modal}>`
      }
    </div>`;
  }

  /** The box: text with "@" mentions and emoji, a reply, GIFs, and files dropped anywhere on the screen, pasted or picked */
  function Composer({ replying, onReplied, typists, people, onTyping }) {
    const [draft, setDraft] = useState('');
    const [files, setFiles] = useState([]);
    // A record the person chose to share, sent with the next message
    const share = useShare();
    const [dropping, setDropping] = useState(false);
    const [busy, setBusy] = useState(false);
    const [error, setError] = useState(null);
    const quiet = useRef(null);
    // Replying puts you in the box, ready to type.
    const bar = useRef(null);
    useEffect(() => {
      if (replying) bar.current?.querySelector('textarea, input[aria-label="Message"]')?.focus();
    }, [replying]);
    const add = (list) => list?.length && setFiles((was) => [...was, ...list]);
    const type = (next) => {
      setDraft(next);
      onTyping(next.length > 0);
      clearTimeout(quiet.current);
      quiet.current = setTimeout(() => onTyping(false), TYPING_MS);
    };

    // Files dropped anywhere on the screen, or pasted wherever the focus is, wait in the box.
    useEffect(() => {
      // Entering a child leaves its parent, so count rather than flicker.
      let depth = 0;
      const carriesFiles = (event) => event.dataTransfer?.types.includes('Files');
      const enter = (event) => {
        if (!carriesFiles(event)) return;
        event.preventDefault();
        depth += 1;
        setDropping(true);
      };
      const over = (event) => carriesFiles(event) && event.preventDefault();
      const leave = (event) => {
        if (!carriesFiles(event)) return;
        depth = Math.max(0, depth - 1);
        if (depth === 0) setDropping(false);
      };
      const done = () => {
        depth = 0;
        setDropping(false);
      };
      const drop = (event) => {
        if (!carriesFiles(event)) return;
        event.preventDefault();
        done();
        add([...event.dataTransfer.files]);
      };
      const paste = (event) => {
        // A copied screenshot is a file among the clipboard's items, whichever list the browser puts it in.
        const data = event.clipboardData;
        const pasted = data?.files.length
          ? [...data.files]
          : [...(data?.items ?? [])].map((item) => item.kind === 'file' && item.getAsFile()).filter(Boolean);
        if (!pasted.length) return;
        event.preventDefault();
        add(pasted);
      };
      const on = { dragenter: enter, dragover: over, dragleave: leave, drop, dragend: done, paste };
      for (const [name, listener] of Object.entries(on)) document.addEventListener(name, listener);
      addEventListener('blur', done);
      return () => {
        for (const [name, listener] of Object.entries(on)) document.removeEventListener(name, listener);
        removeEventListener('blur', done);
      };
    }, []);

    // A GIF goes as soon as it is picked, with whatever is in the box.
    const send = async (gif) => {
      const text =
        draft.trim() ||
        gif?.title ||
        (share.sharing ? recordTitle(share.sharing) : '') ||
        files.map((file) => `📎 ${file.name}`).join('\n');
      if (!text || busy) return;
      setBusy(true);
      setError(null);
      try {
        // Fetched first, so a GIF that can't be had leaves no message without it
        const picked = gif ? [await gifFile(gif)] : [];
        const mentions = mentionsIn(draft, people);
        const answering = replying && replying.createdBy !== me ? { replyingTo: replying.createdBy } : {};
        const sent = await minca.put(
          MESSAGE,
          { text, ...(mentions.length ? { mentions } : {}), ...answering },
          { links: [...share.links, ...(replying ? [{ rel: 'replyTo', to: replying.key }] : [])] },
        );
        await attach(sent.key, [...files, ...picked]);
        setDraft('');
        setFiles([]);
        share.clear();
        onReplied();
        onTyping(false);
      } catch (e) {
        setError(e.message);
      } finally {
        setBusy(false);
      }
    };

    const ready = draft.trim() || files.length || share.sharing;
    return html`<form
      ref=${bar}
      class="stack"
      data-gap="tight"
      onSubmit=${(event) => {
        event.preventDefault();
        send();
      }}
    >
      ${dropping && html`<aside>Drop files to attach</aside>`}
      ${
        (replying || share.sharing || files.length > 0) &&
        html`<div class="row" data-gap="tight">
          ${
            replying &&
            html`<button type="button" aria-pressed="true" title="Don't reply" onClick=${onReplied}>
              ↪ Replying to ${nameIn(people, replying.createdBy)} ✕
            </button>`
          }
          ${share.sharing && html`<${Sharing} share=${share} />`}
          ${files.map(
            (file, i) =>
              html`<${Pending}
                key=${`${file.name}:${i}`}
                file=${file}
                onRemove=${() => setFiles(files.filter((_, j) => j !== i))}
              />`,
          )}
        </div>`
      }
      <small aria-live="polite">
        ${
          typists.length > 0 &&
          `${typists.map((did) => nameIn(people, did)).join(', ')} ${typists.length === 1 ? 'is' : 'are'} typing…`
        }
      </small>
      <div class="row">
        <div
          class="composer"
          data-gifs=${giphyKey ? '' : undefined}
          onKeyDown=${(event) => event.key === 'Escape' && replying && onReplied()}
        >
          <${AddMenu} onShare=${() => share.pick()} onFiles=${add} />
          <${MentionInput}
            value=${draft}
            onChange=${(next) => type(share.typed(draft, next))}
            placeholder=${replying ? `Reply to ${nameIn(people, replying.createdBy)}…` : 'Message…'}
            aria-label="Message"
          />
          <div class="composer-end">
            ${giphyKey && html`<${GifPicker} onPick=${send} disabled=${busy} />`}
            <${EmojiPicker} onPick=${(emoji) => type(draft + emoji)} />
          </div>
        </div>
        <button type="submit" data-intent="primary" disabled=${busy || !ready}>
          ${busy ? 'Sending…' : 'Send'}
        </button>
      </div>
      ${(error || share.error) && html`<p role="alert">${error || share.error}</p>`}
    </form>`;
  }

  render(html`<${Chat} />`);
</script>
