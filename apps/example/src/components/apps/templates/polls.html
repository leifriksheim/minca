<!-- Polls: std.poll and std.vote. One vote per person per poll, so voting again changes it. -->
<script>
  const {
    html,
    render,
    useState,
    useEffect,
    useRef,
    useRecords,
    useCan,
    useShown,
    useView,
    usePeople,
    Person,
    Avatar,
    Empty,
    ago,
  } = ui;
  const { Icon, RowMenu } = ui;
  const POLL = 'std.poll';
  const VOTE = 'std.vote';
  /** The view that asks a new question */
  const NEW = 'new';
  const me = minca.me.did;

  const votesOn = (votes, poll) =>
    votes.filter((v) => v.links.some((l) => l.rel === 'about' && l.to === poll.key));
  // Only votes for an option that exists count: a vote from a buggy app for option 7 of 2 is ignored.
  const counted = (votes, poll) => votes.filter((v) => v.body.choice < poll.body.options.length);

  /**
   * The polls, open ones first; a poll opens one level in (minca.go), and so does asking a new
   * one, so the app's bar names where you are and its Back comes out.
   */
  function Polls() {
    const polls = useRecords(POLL);
    const votes = useRecords(VOTE);
    const mayAsk = useCan('create', POLL);
    const [view, go] = useView();
    const shown = useShown();
    const handled = useRef(null);
    // A poll opened from elsewhere, like one shared in a chat, opens here once it has arrived.
    useEffect(() => {
      const poll = shown && handled.current !== shown && polls?.find((p) => p.key === shown.key);
      if (!poll) return;
      handled.current = shown;
      go(poll.key, poll.body.question);
    }, [shown, polls]);
    if (!polls || !votes) return null;

    if (view === NEW)
      return html`<main>
        <${Ask}
          onAsk=${async (question, options) => {
            const made = await minca.put(POLL, { question, options });
            go(made.key, question);
          }}
        />
      </main>`;
    const opened = view && polls.find((p) => p.key === view);
    if (view && !opened)
      return html`<main>
        <${Empty} shape="bars" colour="coral" title="This poll is gone" text="Someone deleted it." />
      </main>`;
    if (opened)
      return html`<${PollPage} key=${opened.key} poll=${opened} votes=${votesOn(votes, opened)} go=${go} />`;

    const newest = [...polls].reverse();
    const closed = newest.filter((p) => p.body.closed);
    const row = (poll) =>
      html`<${PollRow} key=${poll.key} poll=${poll} votes=${votesOn(votes, poll)} go=${go} />`;
    if (polls.length === 0)
      return html`<main>
        <${Empty} shape="bars" colour="coral" title="No polls yet" text="Ask the group something, and see what everyone picks.">
          ${mayAsk && html`<button data-intent="primary" onClick=${() => go(NEW, 'New poll')}>New poll</button>`}
        </${Empty}>
      </main>`;
    return html`<main>
      <ul role="list" aria-label="Polls">
        ${newest.filter((p) => !p.body.closed).map(row)}
        ${
          mayAsk &&
          html`<li>
            <button data-intent="open" class="row" onClick=${() => go(NEW, 'New poll')}>
              <${Icon} name="plus" /> <span>New poll</span>
            </button>
          </li>`
        }
      </ul>
      ${
        closed.length > 0 &&
        html`<section>
          <h2>Closed <span class="tag">${closed.length}</span></h2>
          <ul role="list" aria-label="Closed">
            ${closed.map(row)}
          </ul>
        </section>`
      }
    </main>`;
  }

  /** What can be done with a poll besides voting: closing it, and taking it away */
  function pollActions(poll, onGone) {
    const closed = !!poll.body.closed;
    return [
      poll.mine && {
        label: closed ? 'Reopen' : 'Close poll',
        onClick: () => minca.update(poll.key, { ...poll.body, closed: !closed }),
      },
      poll.mine && {
        label: 'Delete',
        danger: true,
        confirm: 'Delete this poll and its votes, for everyone?',
        onClick: () => {
          onGone?.();
          minca.remove(poll.key);
        },
      },
    ];
  }

  /** A poll in the overview: its question, how many voted and whether you did; a tap opens it */
  function PollRow({ poll, votes: all, go }) {
    const votes = counted(all, poll);
    const mine = votes.find((v) => v.createdBy === me);
    const count =
      votes.length === 0 ? 'No votes yet' : `${votes.length} ${votes.length === 1 ? 'vote' : 'votes'}`;
    const yours = mine
      ? ` · You picked ${poll.body.options[mine.body.choice]}`
      : poll.body.closed
        ? ''
        : ' · Not voted yet';
    return html`<li class="row">
      <button data-intent="open" class="truncate" onClick=${() => go(poll.key, poll.body.question)}>
        <strong class="truncate">${poll.body.question}</strong>
        <small class="truncate">${count}${yours}</small>
      </button>
      <${RowMenu} label=${`More for ${poll.body.question}`} items=${pollActions(poll)} />
    </li>`;
  }

  /** One poll, opened: its options to pick from, and how the votes fall */
  function PollPage({ poll, votes: all, go }) {
    const people = usePeople();
    const mayVote = useCan('create', VOTE);
    const nameOf = (did) => (did === me ? 'You' : (people.find((p) => p.did === did)?.name ?? 'Someone'));
    const { question, options, closed } = poll.body;
    // The bar names the poll, and again if it changes.
    useEffect(() => go(poll.key, question), [poll.key, question]);
    const votes = counted(all, poll);
    const mine = votes.find((v) => v.createdBy === me);
    const open = mayVote && !closed;
    const counts = options.map((_, i) => votes.filter((v) => v.body.choice === i).length);
    const most = Math.max(0, ...counts);
    const vote = (choice) =>
      mine && mine.body.choice === choice
        ? minca.remove(mine.key)
        : minca.put(
            VOTE,
            { choice, ...(poll.createdBy && poll.createdBy !== me ? { respondingTo: poll.createdBy } : {}) },
            { links: [{ rel: 'about', to: poll.key }] },
          );
    return html`<main>
      <header>
        <small class="row" data-gap="tight">
          Asked by <${Person} did=${poll.createdBy} size=${16} /> · ${ago(poll.createdAt)}
        </small>
        ${closed && html`<span class="tag">Closed</span>`}
        <${RowMenu} label="More for this poll" items=${pollActions(poll, () => go(null))} />
      </header>
      <fieldset class="stack" aria-label="Options" disabled=${!open}>
        ${options.map((option, i) => {
          const these = votes.filter((v) => v.body.choice === i);
          const share = votes.length ? these.length / votes.length : 0;
          // A closed poll's choice, or a tie for it
          const won = closed && most > 0 && counts[i] === most;
          return html`<div
            class="stack"
            data-gap="tight"
            key=${i}
            title=${these.map((v) => nameOf(v.createdBy)).join(', ') || undefined}
          >
            <div class="row" data-spread>
              <label>
                <input
                  type="radio"
                  name=${poll.key}
                  checked=${mine?.body.choice === i}
                  onClick=${() => vote(i)}
                />
                ${won ? html`<strong>${option}</strong>` : option}
              </label>
              ${
                these.length > 0 &&
                html`<span class="row" data-gap="tight">
                    ${these.slice(0, 3).map((v) => html`<${Avatar} key=${v.key} did=${v.createdBy} size=${20} round />`)}
                  </span>
                  <small>${Math.round(share * 100)}%</small>`
              }
            </div>
            ${votes.length > 0 && html`<progress value=${share} max="1"></progress>`}
          </div>`;
        })}
      </fieldset>
      <small>
        ${votes.length === 0 ? 'No votes yet' : `${votes.length} ${votes.length === 1 ? 'vote' : 'votes'}`}
        ${open && mine && ' · tap your choice again to take it back'}
      </small>
    </main>`;
  }

  /** A question and its options: two to start, more on demand, blanks dropped */
  function Ask({ onAsk }) {
    const [question, setQuestion] = useState('');
    const [options, setOptions] = useState(['', '']);
    const [busy, setBusy] = useState(false);
    // autofocus only works on what the page loads with, not on what is added later
    const first = useRef(null);
    useEffect(() => first.current?.focus(), []);
    const filled = options.map((o) => o.trim()).filter(Boolean);
    const unique = new Set(filled).size === filled.length;
    const ready = question.trim() && filled.length >= 2 && unique;
    return html`<form
      class="stack"
      data-gap="loose"
      onSubmit=${(event) => {
        event.preventDefault();
        if (!ready) return;
        setBusy(true);
        onAsk(question.trim(), filled).finally(() => setBusy(false));
      }}
    >
      <label>
        Question
        <input
          ref=${first}
          value=${question}
          onInput=${(e) => setQuestion(e.currentTarget.value)}
          placeholder="Ask a question"
        />
      </label>
      <fieldset>
        <legend>Options</legend>
        ${options.map(
          (option, i) =>
            html`<input
              key=${i}
              value=${option}
              onInput=${(e) => setOptions(options.map((o, j) => (j === i ? e.currentTarget.value : o)))}
              placeholder=${`Option ${i + 1}`}
              aria-label=${`Option ${i + 1}`}
            />`,
        )}
      </fieldset>
      ${
        options.length < 10 &&
        html`<div class="row">
          <button type="button" data-intent="ghost" onClick=${() => setOptions([...options, ''])}>
            <${Icon} name="plus" /> Add option
          </button>
        </div>`
      }
      ${!unique && html`<p role="alert">Two options are the same.</p>`}
      <button type="submit" data-intent="primary" disabled=${!ready || busy}>
        ${busy ? 'Asking…' : 'Ask'}
      </button>
    </form>`;
  }

  render(html`<${Polls} />`);
</script>
