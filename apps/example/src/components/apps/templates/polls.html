<!-- Polls: std.poll and std.vote. One vote per person per poll, so voting again changes it. -->
<script>
  const {
    html,
    render,
    useState,
    useEffect,
    useRef,
    useRecords,
    useCan,
    useMarked,
    usePeople,
    Person,
    Avatar,
    Modal,
    Empty,
    ago,
  } = ui;
  const { Icon, RowMenu } = ui;
  const POLL = 'std.poll';
  const VOTE = 'std.vote';
  const me = minca.me.did;

  function Polls() {
    const polls = useRecords(POLL);
    const votes = useRecords(VOTE);
    const mayAsk = useCan('create', POLL);
    const mayVote = useCan('create', VOTE);
    const [asking, setAsking] = useState(false);
    // A poll opened from elsewhere, like one shared in a chat: scrolled to and lit up a moment.
    const marked = useMarked();
    if (!polls || !votes) return null;
    // Open ones first, the newest on top; closed ones after, the newest first too.
    const shown = [...polls].reverse().sort((a, b) => Number(!!a.body.closed) - Number(!!b.body.closed));
    const ask =
      asking &&
      html`<${Modal} title="New poll" onClose=${() => setAsking(false)} width=${480}>
        <${Ask}
          onCancel=${() => setAsking(false)}
          onAsk=${async (question, options) => {
            await minca.put(POLL, { question, options });
            setAsking(false);
          }}
        />
      </${Modal}>`;
    if (polls.length === 0)
      return html`<main>
        <${Empty} shape="bars" colour="coral" title="No polls yet" text="Ask the group something, and see what everyone picks.">
          ${mayAsk && html`<button data-intent="primary" onClick=${() => setAsking(true)}>New poll</button>`}
        </${Empty}>
        ${ask}
      </main>`;
    return html`<main>
      ${mayAsk && html`<div class="row"><button data-intent="primary" onClick=${() => setAsking(true)}>New poll</button></div>`}
      ${shown.map(
        (poll) =>
          html`<${Poll}
            key=${poll.key}
            poll=${poll}
            votes=${votes.filter((v) => v.links.some((l) => l.rel === 'about' && l.to === poll.key))}
            mayVote=${mayVote}
            marked=${poll.key === marked}
          />`,
      )}
      ${ask}
    </main>`;
  }

  function Poll({ poll, votes: all, mayVote, marked }) {
    const people = usePeople();
    const nameOf = (did) => (did === me ? 'You' : (people.find((p) => p.did === did)?.name ?? 'Someone'));
    const { question, options, closed } = poll.body;
    // Only votes for an option that exists count: a vote from a buggy app for option 7 of 2 is ignored.
    const votes = all.filter((v) => v.body.choice < options.length);
    const mine = votes.find((v) => v.createdBy === me);
    const open = mayVote && !closed;
    const counts = options.map((_, i) => votes.filter((v) => v.body.choice === i).length);
    const most = Math.max(0, ...counts);
    const vote = (choice) =>
      mine && mine.body.choice === choice
        ? minca.remove(mine.key)
        : minca.put(
            VOTE,
            { choice, ...(poll.createdBy && poll.createdBy !== me ? { respondingTo: poll.createdBy } : {}) },
            { links: [{ rel: 'about', to: poll.key }] },
          );
    return html`<article data-key=${poll.key} data-marked=${marked}>
      <header>
        <h3>${question}</h3>
        ${closed && html`<span class="tag">Closed</span>`}
        <${RowMenu}
          label="More for this poll"
          items=${[
            { label: 'Open', onClick: () => minca.open({ record: poll.key }) },
            poll.mine && {
              label: closed ? 'Reopen' : 'Close poll',
              onClick: () => minca.update(poll.key, { ...poll.body, closed: !closed }),
            },
            poll.mine && {
              label: 'Delete',
              danger: true,
              confirm: 'Delete this poll and its votes, for everyone?',
              onClick: () => minca.remove(poll.key),
            },
          ]}
        />
      </header>
      <small class="row" data-gap="tight">
        Asked by <${Person} did=${poll.createdBy} size=${16} /> · ${ago(poll.createdAt)}
      </small>
      <fieldset class="stack" aria-label="Options" disabled=${!open}>
        ${options.map((option, i) => {
          const these = votes.filter((v) => v.body.choice === i);
          const share = votes.length ? these.length / votes.length : 0;
          // A closed poll's choice, or a tie for it
          const won = closed && most > 0 && counts[i] === most;
          return html`<div
            class="stack"
            data-gap="tight"
            key=${i}
            title=${these.map((v) => nameOf(v.createdBy)).join(', ') || undefined}
          >
            <div class="row" data-spread>
              <label>
                <input
                  type="radio"
                  name=${poll.key}
                  checked=${mine?.body.choice === i}
                  onClick=${() => vote(i)}
                />
                ${won ? html`<strong>${option}</strong>` : option}
              </label>
              ${
                these.length > 0 &&
                html`<span class="row" data-gap="tight">
                    ${these.slice(0, 3).map((v) => html`<${Avatar} key=${v.key} did=${v.createdBy} size=${20} round />`)}
                  </span>
                  <small>${Math.round(share * 100)}%</small>`
              }
            </div>
            ${votes.length > 0 && html`<progress value=${share} max="1"></progress>`}
          </div>`;
        })}
      </fieldset>
      <small>
        ${votes.length === 0 ? 'No votes yet' : `${votes.length} ${votes.length === 1 ? 'vote' : 'votes'}`}
        ${open && mine && ' · tap your choice again to take it back'}
      </small>
    </article>`;
  }

  /** A question and its options: two to start, more on demand, blanks dropped */
  function Ask({ onAsk, onCancel }) {
    const [question, setQuestion] = useState('');
    const [options, setOptions] = useState(['', '']);
    const [busy, setBusy] = useState(false);
    // autofocus only works on what the page loads with, not on what is added later
    const first = useRef(null);
    useEffect(() => first.current?.focus(), []);
    const filled = options.map((o) => o.trim()).filter(Boolean);
    const unique = new Set(filled).size === filled.length;
    const ready = question.trim() && filled.length >= 2 && unique;
    return html`<form
      class="stack"
      data-gap="loose"
      onSubmit=${(event) => {
        event.preventDefault();
        if (!ready) return;
        setBusy(true);
        onAsk(question.trim(), filled).finally(() => setBusy(false));
      }}
    >
      <label>
        Question
        <input
          ref=${first}
          value=${question}
          onInput=${(e) => setQuestion(e.currentTarget.value)}
          placeholder="Ask a question"
        />
      </label>
      <fieldset>
        <legend>Options</legend>
        ${options.map(
          (option, i) =>
            html`<input
              key=${i}
              value=${option}
              onInput=${(e) => setOptions(options.map((o, j) => (j === i ? e.currentTarget.value : o)))}
              placeholder=${`Option ${i + 1}`}
              aria-label=${`Option ${i + 1}`}
            />`,
        )}
      </fieldset>
      ${
        options.length < 10 &&
        html`<div class="row">
          <button type="button" data-intent="ghost" onClick=${() => setOptions([...options, ''])}>
            <${Icon} name="plus" /> Add option
          </button>
        </div>`
      }
      ${!unique && html`<p role="alert">Two options are the same.</p>`}
      <div class="row" data-spread>
        <button type="button" data-intent="ghost" onClick=${onCancel}>Cancel</button>
        <button type="submit" data-intent="primary" disabled=${!ready || busy}>
          ${busy ? 'Asking…' : 'Ask'}
        </button>
      </div>
    </form>`;
  }

  render(html`<${Polls} />`);
</script>
