<!-- Polls: std.poll and std.vote. One vote per person per poll, so voting again changes it. -->
<style>
  .top {
    display: flex;
    justify-content: flex-end;
  }
  .poll {
    gap: 14px;
    padding: 18px;
  }
  .title {
    min-height: 0;
    padding: 0;
    border: none;
    background: none;
    font-family: var(--minca-display);
    font-size: 18px;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: var(--minca-ink);
    justify-content: flex-start;
    text-align: left;
    word-break: break-word;
  }
  .title:hover {
    background: none;
    text-decoration: underline;
  }
  .asked {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: -8px;
    font-size: 12.5px;
    color: var(--minca-faint);
  }
  .asked .badge {
    margin-left: auto;
  }
  .option {
    position: relative;
    overflow: hidden;
    justify-content: flex-start;
    gap: 10px;
    height: 44px;
    border-radius: var(--minca-radius-md);
    border-color: var(--minca-line);
    font-size: 14px;
    font-weight: 400;
    color: var(--minca-body);
  }
  .option:disabled {
    opacity: 1;
  }
  .option[aria-pressed='true'] {
    border-color: var(--minca-ink);
    font-weight: 600;
  }
  /* A closed poll's choice, or a tie for it */
  .option[data-won] {
    border-color: var(--minca-accent);
    font-weight: 600;
  }
  .option .fill {
    position: absolute;
    inset: 0;
    background: var(--minca-sunken);
    transition: width 0.3s ease;
  }
  .option[aria-pressed='true'] .fill,
  .option[data-won] .fill {
    background: var(--minca-accent-soft);
  }
  .option .radio {
    position: relative;
    width: 16px;
    height: 16px;
    flex-shrink: 0;
    border-radius: 50%;
    border: 1.5px solid var(--minca-line-strong);
  }
  .option[aria-pressed='true'] .radio {
    border-color: var(--minca-ink);
    background: var(--minca-ink);
    box-shadow: inset 0 0 0 2.5px var(--minca-card);
  }
  .option .label {
    position: relative;
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    text-align: left;
  }
  /* Who picked it, as a few overlapping faces, and its share */
  .option .faces {
    position: relative;
    display: flex;
  }
  .option .faces > * + * {
    margin-left: -6px;
  }
  .option .share {
    position: relative;
    min-width: 34px;
    font-size: 12.5px;
    color: var(--minca-muted);
    text-align: right;
    font-variant-numeric: tabular-nums;
  }
  footer.row {
    flex-wrap: wrap;
    font-size: 12.5px;
    color: var(--minca-faint);
  }
  footer button {
    min-height: 28px;
    padding: 0 10px;
    font-size: 12.5px;
  }
</style>
<script>
  const {
    html,
    render,
    useState,
    useEffect,
    useRef,
    useRecords,
    useCan,
    useMarked,
    usePeople,
    Person,
    Avatar,
    Modal,
    Empty,
    ago,
  } = ui;
  const POLL = 'std.poll';
  const VOTE = 'std.vote';
  const me = minca.me.did;

  function Polls() {
    const polls = useRecords(POLL);
    const votes = useRecords(VOTE);
    const mayAsk = useCan('create', POLL);
    const mayVote = useCan('create', VOTE);
    const [asking, setAsking] = useState(false);
    // A poll opened from elsewhere, like one shared in a chat: scrolled to and lit up a moment.
    const marked = useMarked();
    if (!polls || !votes) return null;
    // Open ones first, the newest on top; closed ones after, the newest first too.
    const shown = [...polls].reverse().sort((a, b) => Number(!!a.body.closed) - Number(!!b.body.closed));
    const ask =
      asking &&
      html`<${Modal} title="New poll" onClose=${() => setAsking(false)} width=${480}>
        <${Ask}
          onCancel=${() => setAsking(false)}
          onAsk=${async (question, options) => {
            await minca.put(POLL, { question, options });
            setAsking(false);
          }}
        />
      </${Modal}>`;
    if (polls.length === 0)
      return html`<${Empty} shape="bars" colour="coral" title="No polls yet" text="Ask the group something, and see what everyone picks.">
          ${mayAsk && html`<button data-variant="primary" onClick=${() => setAsking(true)}>New poll</button>`}
        </${Empty}>${ask}`;
    return html`<div class="stack" style="gap: 16px">
      ${mayAsk && html`<div class="top"><button data-variant="primary" onClick=${() => setAsking(true)}>+ New poll</button></div>`}
      ${shown.map(
        (poll) =>
          html`<${Poll}
            key=${poll.key}
            poll=${poll}
            votes=${votes.filter((v) => v.links.some((l) => l.rel === 'about' && l.to === poll.key))}
            mayVote=${mayVote}
            marked=${poll.key === marked}
          />`,
      )}
      ${ask}
    </div>`;
  }

  function Poll({ poll, votes: all, mayVote, marked }) {
    const people = usePeople();
    const nameOf = (did) => (did === me ? 'You' : (people.find((p) => p.did === did)?.name ?? 'Someone'));
    const { question, options, closed } = poll.body;
    // Only votes for an option that exists count: a vote from a buggy app for option 7 of 2 is ignored.
    const votes = all.filter((v) => v.body.choice < options.length);
    const mine = votes.find((v) => v.createdBy === me);
    const open = mayVote && !closed;
    const counts = options.map((_, i) => votes.filter((v) => v.body.choice === i).length);
    const most = Math.max(0, ...counts);
    const vote = (choice) =>
      mine && mine.body.choice === choice
        ? minca.remove(mine.key)
        : minca.put(
            VOTE,
            { choice, ...(poll.createdBy && poll.createdBy !== me ? { respondingTo: poll.createdBy } : {}) },
            { links: [{ rel: 'about', to: poll.key }] },
          );
    return html`<article class="card stack poll" data-key=${poll.key} data-marked=${marked}>
      <button class="title" title="Open this poll" onClick=${() => minca.open({ record: poll.key })}>
        ${question}
      </button>
      <div class="asked">
        <span>Asked by</span>
        <${Person} did=${poll.createdBy} size=${16} />
        <span>· ${ago(poll.createdAt)}</span>
        ${closed && html`<span class="badge">Closed</span>`}
      </div>
      <div class="stack" role="group" aria-label="Options" style="gap: 8px">
        ${options.map((option, i) => {
          const these = votes.filter((v) => v.body.choice === i);
          const share = votes.length ? these.length / votes.length : 0;
          return html`<button
            class="option"
            key=${i}
            disabled=${!open}
            aria-pressed=${mine?.body.choice === i}
            data-won=${closed && most > 0 && counts[i] === most ? '' : undefined}
            title=${these.map((v) => nameOf(v.createdBy)).join(', ') || undefined}
            onClick=${() => vote(i)}
          >
            <span class="fill" style=${{ width: `${share * 100}%` }}></span>
            <span class="radio"></span>
            <span class="label">${option}</span>
            ${
              these.length > 0 &&
              html`<span class="faces">
                  ${these.slice(0, 3).map((v) => html`<${Avatar} key=${v.key} did=${v.createdBy} size=${20} round />`)}
                </span>
                <span class="share">${Math.round(share * 100)}%</span>`
            }
          </button>`;
        })}
      </div>
      <footer class="row">
        <span>
          ${votes.length === 0 ? 'No votes yet' : `${votes.length} ${votes.length === 1 ? 'vote' : 'votes'}`}
          ${open && mine && ' · tap your choice again to take it back'}
        </span>
        ${
          poll.mine &&
          html`<span class="row" style="margin-left: auto; gap: 2px">
            <button
              data-variant="ghost"
              onClick=${() => minca.update(poll.key, { ...poll.body, closed: !closed })}
            >
              ${closed ? 'Reopen' : 'Close poll'}
            </button>
            <button data-variant="ghost" onClick=${() => minca.remove(poll.key)}>Delete</button>
          </span>`
        }
      </footer>
    </article>`;
  }

  /** A question and its options: two to start, more on demand, blanks dropped */
  function Ask({ onAsk, onCancel }) {
    const [question, setQuestion] = useState('');
    const [options, setOptions] = useState(['', '']);
    const [busy, setBusy] = useState(false);
    // autofocus only works on what the page loads with, not on what is added later
    const first = useRef(null);
    useEffect(() => first.current?.focus(), []);
    const filled = options.map((o) => o.trim()).filter(Boolean);
    const unique = new Set(filled).size === filled.length;
    const ready = question.trim() && filled.length >= 2 && unique;
    return html`<form
      class="stack"
      onSubmit=${(event) => {
        event.preventDefault();
        if (!ready) return;
        setBusy(true);
        onAsk(question.trim(), filled).finally(() => setBusy(false));
      }}
    >
      <input
        ref=${first}
        value=${question}
        onInput=${(e) => setQuestion(e.currentTarget.value)}
        placeholder="Ask a question"
        aria-label="Question"
      />
      ${options.map(
        (option, i) =>
          html`<input
            key=${i}
            value=${option}
            onInput=${(e) => setOptions(options.map((o, j) => (j === i ? e.currentTarget.value : o)))}
            placeholder=${`Option ${i + 1}`}
            aria-label=${`Option ${i + 1}`}
          />`,
      )}
      ${!unique && html`<p style="color: var(--minca-danger); font-size: 13px">Two options are the same.</p>`}
      <div class="row" style="flex-wrap: wrap">
        ${options.length < 10 && html`<button type="button" onClick=${() => setOptions([...options, ''])}>+ Add option</button>`}
        <span style="flex: 1"></span>
        <button type="button" onClick=${onCancel}>Cancel</button>
        <button type="submit" data-variant="primary" disabled=${!ready || busy}>
          ${busy ? 'Asking…' : 'Ask'}
        </button>
      </div>
    </form>`;
  }

  render(html`<${Polls} />`);
</script>
