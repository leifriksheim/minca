<!-- Lists: simple lists anyone in the space can tick and add to, on std.list and std.list-item. Each item is a record of its own, ordered by position, so two people adding or ticking at once never undo each other. The lists come first; one opens one level in (minca.go), so the app's bar names it and its Back comes back out. -->
<script>
  const {
    html,
    render,
    useState,
    useEffect,
    useRef,
    useRecords,
    useCan,
    useShown,
    useView,
    Empty,
    positionBetween,
  } = ui;
  const { Icon } = ui;
  const LIST = 'std.list';
  const ITEM = 'std.list-item';
  /** The kinds of std.list this app shows: other apps keep lists too, like the categories of files */
  const KINDS = ['checklist', 'todo', 'shopping', 'packing'];

  const inList = (item) => item.links.find((l) => l.rel === 'in')?.to;
  // Anyone can write records without this screen: check a body has what is read before reading it.
  const textOf = (item) => (typeof item.body?.text === 'string' ? item.body.text : '');
  const titleOf = (list) => (typeof list.body?.title === 'string' && list.body.title.trim()) || 'Untitled';
  const byPosition = (a, b) => {
    const pa = a.body.position;
    const pb = b.body.position;
    if (pa !== pb) return pa === undefined ? 1 : pb === undefined ? -1 : pa < pb ? -1 : 1;
    return a.createdAt.localeCompare(b.createdAt);
  };

  function App() {
    const lists = useRecords(LIST);
    const items = useRecords(ITEM);
    const [view, go] = useView();
    const shown = useShown();
    const handled = useRef(null);
    // A list opened from elsewhere opens here, once it has arrived.
    useEffect(() => {
      const list = shown && handled.current !== shown && lists?.find((l) => l.key === shown.key);
      if (!list) return;
      handled.current = shown;
      go(list.key, titleOf(list));
    }, [shown, lists]);
    if (!lists || !items) return null;

    const mine = lists.filter((l) => l.body && (KINDS.includes(l.body.kind) || l.body.kind === undefined));
    const itemsOf = (key) => items.filter((i) => i.body && inList(i) === key).sort(byPosition);
    // Any list once opened, though only its own kinds are listed: one of a kind no app here shows
    // opens here from elsewhere too.
    const open = view && lists.find((l) => l.key === view && l.body);
    if (view && !open)
      return html`<main>
        <${Empty} shape="tick" colour="peach" title="This list is gone" text="Someone deleted it." />
      </main>`;
    return open
      ? html`<${List} key=${open.key} list=${open} items=${itemsOf(open.key)} go=${go} />`
      : html`<${Lists} lists=${mine} itemsOf=${itemsOf} go=${go} />`;
  }

  /** Every list, the one last changed first, and a row to start another */
  function Lists({ lists, itemsOf, go }) {
    const mayCreate = useCan('create', LIST);
    const touched = (list) =>
      itemsOf(list.key).reduce((last, i) => (i.updatedAt > last ? i.updatedAt : last), list.updatedAt);
    const sorted = [...lists].sort((a, b) => touched(b).localeCompare(touched(a)));
    const create = async (title) => {
      const made = await minca.put(LIST, { title, kind: 'checklist' });
      go(made.key, title);
    };
    return html`<main>
      ${sorted.length === 0 && html`<${Empty} shape="tick" colour="peach" title="No lists yet" text="Start one for groceries, packing or the week." />`}
      <ul role="list" aria-label="Lists">
        ${sorted.map((list) => {
          const all = itemsOf(list.key);
          const left = all.filter((i) => !i.body.checked).length;
          return html`<li key=${list.key}>
            <button data-intent="open" onClick=${() => go(list.key, titleOf(list))}>
              <strong class="truncate">${list.body.icon ? `${list.body.icon} ` : ''}${titleOf(list)}</strong>
              <small>${all.length === 0 ? 'Empty' : left === 0 ? 'All done' : `${left} left`}</small>
            </button>
          </li>`;
        })}
        ${mayCreate && html`<li><${AddRow} placeholder="New list" onAdd=${create} keep=${false} /></li>`}
      </ul>
    </main>`;
  }

  /** One list: what is left, a row to add to it, then what is done */
  function List({ list, items, go }) {
    const mayAdd = useCan('create', ITEM);
    const mayDelete = useCan('delete', list.key);
    const mayRename = useCan('edit', list.key);
    const [renaming, setRenaming] = useState(false);
    const [deleting, setDeleting] = useState(false);
    // The bar names the list, and again when someone renames it.
    useEffect(() => go(list.key, titleOf(list)), [list.key, titleOf(list)]);

    const todo = items.filter((i) => !i.body.checked);
    const done = items.filter((i) => i.body.checked);
    const add = (text) =>
      minca.put(
        ITEM,
        { text, checked: false, position: positionBetween(todo.at(-1)?.body.position) },
        { links: [{ rel: 'in', to: list.key }] },
      );
    const removeList = async () => {
      // Its items first, so none is left on a list that is gone; one that can't go stays, harmlessly.
      await Promise.allSettled(items.map((i) => minca.remove(i.key)));
      await minca.remove(list.key);
      go(null);
    };

    return html`<main>
      ${
        renaming &&
        html`<ul role="list">
          <li>
            <${AddRow}
              placeholder="Name"
              initial=${titleOf(list)}
              keep=${false}
              onAdd=${async (title) => {
                await minca.update(list.key, { ...list.body, title });
                setRenaming(false);
              }}
              onCancel=${() => setRenaming(false)}
            />
          </li>
        </ul>`
      }
      <ul role="list" aria-label="To do">
        ${todo.map((item) => html`<${Item} key=${item.key} item=${item} />`)}
        ${mayAdd && html`<li><${AddRow} placeholder="Add an item" onAdd=${add} keep=${true} /></li>`}
        ${!mayAdd && todo.length === 0 && html`<li><small>Nothing left to do.</small></li>`}
      </ul>
      ${
        done.length > 0 &&
        html`<section>
          <header>
            <h2>Done <span class="tag">${done.length}</span></h2>
            ${mayAdd && html`<button data-intent="ghost" onClick=${() => Promise.allSettled(done.map((i) => minca.remove(i.key)))}>Clear</button>`}
          </header>
          <ul role="list" aria-label="Done">
            ${done.map((item) => html`<${Item} key=${item.key} item=${item} />`)}
          </ul>
        </section>`
      }
      <div class="row" data-gap="tight">
        ${mayRename && !renaming && html`<button data-intent="ghost" onClick=${() => setRenaming(true)}>Rename</button>`}
        ${
          mayDelete &&
          (deleting
            ? html`<button data-intent="danger" onClick=${removeList}>Delete for everyone</button>
                <button data-intent="ghost" onClick=${() => setDeleting(false)}>Keep it</button>`
            : html`<button data-intent="ghost" onClick=${() => setDeleting(true)}>Delete list</button>`)
        }
      </div>
    </main>`;
  }

  /**
   * One item: a box to tick it, and its text, which a tap turns into a field. Enter or leaving it
   * saves, Escape keeps what was there, and an empty item goes. What someone else changes shows,
   * except in the one being typed in.
   */
  function Item({ item }) {
    const mayEdit = useCan('edit', item.key);
    const [draft, setDraft] = useState(null);
    const field = useRef(null);
    const checked = item.body.checked === true;
    useEffect(() => {
      if (draft !== null) field.current?.focus();
    }, [draft !== null]);
    const save = async () => {
      if (draft === null) return;
      const text = draft.trim();
      setDraft(null);
      if (!text) return minca.remove(item.key);
      if (text !== textOf(item)) await minca.update(item.key, { ...item.body, text });
    };
    return html`<li>
      <label>
        <input
          type="checkbox"
          checked=${checked}
          aria-label=${checked ? 'Not done' : 'Done'}
          disabled=${!mayEdit}
          onChange=${() => minca.update(item.key, { ...item.body, checked: !checked })}
        />
        ${
          draft === null
            ? html`<button data-intent="open" disabled=${!mayEdit} onClick=${() => setDraft(textOf(item))}>
                ${checked ? html`<s>${textOf(item)}</s>` : textOf(item) || ' '}
              </button>`
            : html`<input
                  ref=${field}
                  value=${draft}
                  aria-label="Item"
                  maxlength="1000"
                  onInput=${(e) => setDraft(e.currentTarget.value)}
                  onBlur=${save}
                  onKeyDown=${(e) => {
                    if (e.key === 'Enter') e.currentTarget.blur();
                    if (e.key === 'Escape') setDraft(null);
                  }}
                />
                <button
                  data-intent="ghost"
                  data-icon
                  aria-label="Delete item"
                  onPointerDown=${(e) => e.preventDefault()}
                  onClick=${() => {
                    setDraft(null);
                    minca.remove(item.key);
                  }}
                >
                  <${Icon} name="close" />
                </button>`
        }
      </label>
    </li>`;
  }

  /** A row to type something new into: Enter adds it (no button, so the row never changes size), and with `keep` the field stays for the next */
  function AddRow({ placeholder, onAdd, keep, initial = '', onCancel }) {
    const [text, setText] = useState(initial);
    const [busy, setBusy] = useState(false);
    const submit = async () => {
      const value = text.trim();
      if (!value || busy) return;
      setBusy(true);
      try {
        await onAdd(value);
        setText('');
      } finally {
        setBusy(false);
      }
    };
    return html`<form
      class="row"
      onSubmit=${(e) => {
        e.preventDefault();
        submit();
      }}
    >
      <${Icon} name="plus" />
      <input
        value=${text}
        placeholder=${placeholder}
        aria-label=${placeholder}
        maxlength="200"
        autofocus=${!!onCancel}
        enterkeyhint=${keep ? 'next' : 'done'}
        onInput=${(e) => setText(e.currentTarget.value)}
        onKeyDown=${(e) => e.key === 'Escape' && onCancel?.()}
      />
    </form>`;
  }

  render(html`<${App} />`);
</script>
