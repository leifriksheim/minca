<!-- Calls: std.call as a call log. Calls themselves are live and kept nowhere; having this app is what makes a space remember them. -->
<style>
  #app {
    max-width: 640px;
  }
  .call {
    padding: 10px 4px;
    border-bottom: 1px solid var(--minca-line);
  }
  .call.missed p:first-child {
    color: var(--minca-danger);
  }
</style>
<script>
  const { html, render, useRecords, usePeople, Avatar, Shape, ago } = ui;
  const me = minca.me.did;

  function Calls() {
    const calls = useRecords('std.call');
    if (!calls) return null;
    return html`<div class="stack" style="gap: 16px">
      <p class="muted">
        Start a call from the space's sidebar; it keeps going while you move between spaces. To ring one
        person, use Call beside their name in People.
      </p>
      ${
        calls.length === 0 &&
        html`<div class="empty stack" style="align-items: center">
          <${Shape} kind="arch" colour="coral" size=${40} />
          No calls yet.
        </div>`
      }
      <div class="stack" style="gap: 0">
        ${[...calls].reverse().map((record) => html`<${Entry} key=${record.key} record=${record} />`)}
      </div>
    </div>`;
  }

  /** "Call with Ada, Bo", "Missed call from Ada" or "You called Ada — no answer", and when */
  function Entry({ record }) {
    const call = record.body;
    const by = record.createdBy;
    const missed = call.status === 'missed';
    const others = (call.people ?? []).filter((did) => did !== me);
    const who = missed ? (by === me ? call.to : by) : others[0];
    const people = usePeople();
    const nameOf = (did) => people.find((one) => one.did === did)?.name ?? 'Someone';
    const title = missed
      ? by === me
        ? `You called ${nameOf(call.to)} — no answer`
        : `Missed call from ${nameOf(by)}`
      : `Call with ${others.map(nameOf).join(', ') || 'nobody'}`;
    const minutes = call.endedAt
      ? Math.max(1, Math.round((Date.parse(call.endedAt) - Date.parse(call.startedAt)) / 60_000))
      : null;
    return html`<div class=${missed && by !== me ? 'call row missed' : 'call row'}>
      ${who ? html`<${Avatar} did=${who} size=${28} round />` : html`<span style="width: 28px"></span>`}
      <div style="flex: 1; min-width: 0">
        <p>${title}</p>
        <p class="faint">${ago(call.startedAt)}${minutes !== null ? ` · ${minutes} min` : ''}</p>
      </div>
    </div>`;
  }

  render(html`<${Calls} />`);
</script>
