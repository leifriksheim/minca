<!-- Events: std.event and std.rsvp, the way people browse what's on. Covers and dates up front, what's next first, a month to look across, and on each event who's going and a place to talk about it (std.comment). -->
<script>
  const {
    html,
    render,
    useState,
    useEffect,
    useRecords,
    useCan,
    useShown,
    useView,
    Person,
    Avatar,
    Comments,
    Modal,
    Shape,
    Cover,
    useFile,
    attach,
  } = ui;
  const { PlaceField, NearButton, MapLink, useNear, placeLabel, distanceText, inReach, nearWhere, when } = ui;
  const EVENT = 'std.event';
  const RSVP = 'std.rsvp';
  const FILE = 'std.file';
  const me = minca.me.did;

  /**
   * An event's cover photo: the newest picture its host kept about it (a std.file, ui.attach). Only the
   * host's, so nobody else can put a picture of their own on someone's event. Null while there is none.
   */
  function useCoverPhoto(event) {
    const files = useRecords(FILE, { 'link:about': event?.key ?? '' });
    const photo = (files ?? [])
      .filter((f) => f.createdBy === event?.createdBy && f.body.mime?.startsWith('image/'))
      .sort((a, b) => b.createdAt.localeCompare(a.createdAt))[0];
    return useFile(photo?.key ?? '', photo?.body.blob);
  }

  /** An event's cover: its photo when it has one, or else a shape in its kind's colour, with whatever goes on it */
  function EventCover({ event, size, children }) {
    const photo = useCoverPhoto(event);
    return html`<${Cover} seed=${event.key} colour=${kindOf(event.body.category).colour} size=${size} wide>
      ${photo && html`<img src=${photo} alt="" />`}${children}
    </${Cover}>`;
  }

  /** What an event can be, for its cover and for browsing by kind. The last is the catch-all. */
  const KINDS = [
    { id: 'music', label: 'Music', emoji: '🎸', colour: 'lilac' },
    { id: 'meetup', label: 'Meetups', emoji: '👋', colour: 'cobalt' },
    { id: 'party', label: 'Parties', emoji: '🎉', colour: 'lilac' },
    { id: 'food', label: 'Food & drink', emoji: '🍷', colour: 'coral' },
    { id: 'sports', label: 'Sports', emoji: '⚽', colour: 'sage' },
    { id: 'outdoors', label: 'Outdoors', emoji: '🏕️', colour: 'peach' },
    { id: 'arts', label: 'Arts & culture', emoji: '🎨', colour: 'lilac' },
    { id: 'learning', label: 'Talks & classes', emoji: '💡', colour: 'peach' },
    { id: 'other', label: 'Other', emoji: '✨', colour: 'cobalt' },
  ];
  const kindOf = (id) => KINDS.find((k) => k.id === id) ?? KINDS[KINDS.length - 1];
  /** A kind's colour as a hue, for its events in the month */
  const HUES = { cobalt: '1', coral: '2', peach: '3', sage: '4', lilac: '5' };

  const VIEWS = [
    { id: 'upcoming', label: 'Upcoming' },
    { id: 'calendar', label: 'Calendar' },
    { id: 'mine', label: 'Your plans' },
    { id: 'hosting', label: 'Hosting' },
    { id: 'past', label: 'Past' },
  ];
  const ANSWERS = [
    { status: 'going', label: 'Going', on: '✓ Going' },
    { status: 'maybe', label: 'Interested', on: '★ Interested' },
    { status: 'no', label: "Can't go", on: "Can't go" },
  ];

  /** The time now, to the minute, so what counts as upcoming moves on while the app is open */
  function useMinute() {
    const [now, setNow] = useState(() => new Date());
    useEffect(() => {
      const timer = setInterval(() => setNow(new Date()), 60_000);
      return () => clearInterval(timer);
    }, []);
    return now;
  }

  /**
   * Each person's answer. One per person is the rule (onePer), but two
   * devices can each write one before they sync, so the newest counts.
   */
  function latestAnswers(rsvps) {
    const answers = new Map();
    for (const a of rsvps) {
      const had = answers.get(a.createdBy);
      if (!had || had.updatedAt < a.updatedAt) answers.set(a.createdBy, a);
    }
    return answers;
  }
  /** How many are coming: each person going, and whoever they bring */
  const countOf = (answers, status) =>
    [...answers.values()]
      .filter((a) => a.body.status === status)
      .reduce((sum, a) => sum + 1 + (status === 'going' ? (a.body.guests ?? 0) : 0), 0);
  /** "12 going · 4 interested", or nothing yet */
  function headcount(answers) {
    const going = countOf(answers, 'going');
    const maybe = countOf(answers, 'maybe');
    return [going && `${going} going`, maybe && `${maybe} interested`].filter(Boolean).join(' · ');
  }

  /** Answering, changing an answer, or (with null) taking it back */
  function answer(event, mine, status) {
    if (status === null) return mine && minca.remove(mine.key);
    if (mine) return minca.update(mine.key, { ...mine.body, status });
    return minca.put(
      RSVP,
      { status, ...(event.createdBy && event.createdBy !== me ? { respondingTo: event.createdBy } : {}) },
      { links: [{ rel: 'about', to: event.key }] },
    );
  }

  /** The event as a file a calendar app opens */
  function download(event) {
    const { body } = event;
    const ics = when.icsOf(event.key, { ...body, location: placeLabel(body.place) || undefined });
    minca.save(`${body.title.replace(/[^\w -]+/g, '').trim() || 'event'}.ics`, ics, 'text/calendar');
  }

  /** Text as it was typed: a paragraph to a line */
  const paragraphs = (text) => text.split(/\n+/).map((line, i) => html`<p key=${i}>${line}</p>`);

  function Events() {
    const all = useRecords(EVENT);
    const rsvps = useRecords(RSVP);
    const mayCreate = useCan('create', EVENT);
    const [view, setView] = useState('upcoming');
    const [kind, setKind] = useState(null);
    // An event's page is one level in: the app's bar names it, and its Back comes back out.
    const [openKey, goTo] = useView();
    const [editing, setEditing] = useState(null);
    // An event opened from elsewhere, like one shared in a chat: its page.
    const asked = useShown();
    useEffect(() => {
      if (asked) goTo(asked.key);
    }, [asked]);
    // The bar names the open event, once it is here, and again if it is renamed.
    const openTitle = openKey && all?.find((e) => e.key === openKey)?.body.title;
    useEffect(() => {
      if (openTitle) goTo(openKey, openTitle);
    }, [openKey, openTitle]);
    const now = useMinute();
    const [near, setNear] = useNear();
    // The cells around the circle, as a keeper would match them; then the exact distance.
    const candidates = useRecords(EVENT, near ? nearWhere(near) : undefined);
    if (!all || !rsvps || !candidates) return null;

    const events = [...all].sort((a, b) => when.dateOf(a.body.start) - when.dateOf(b.body.start));
    const answersOf = (e) =>
      latestAnswers(rsvps.filter((r) => r.links.some((l) => l.rel === 'about' && l.to === e.key)));
    const close = near
      ? new Set(candidates.filter((e) => inReach(near, e.body.place)).map((e) => e.key))
      : null;
    // Somewhere near, or online: an event with a link and no place is anywhere.
    const browsable = (e) => !close || close.has(e.key) || (!e.body.place?.lat && !!e.body.url);
    const shared = { now, near, answersOf, onOpen: (e) => goTo(e.key, e.body.title) };

    const form =
      editing &&
      html`<${EventForm}
        initial=${editing === 'new' ? null : editing}
        near=${near}
        onClose=${() => setEditing(null)}
        onSave=${async (body, photo) => {
          const key = editing === 'new' ? (await minca.put(EVENT, body)).key : editing.key;
          if (editing !== 'new') await minca.update(key, body);
          if (photo) await attach(key, [photo]);
          if (editing === 'new') goTo(key, body.title);
          setEditing(null);
        }}
      />`;

    const open = openKey && events.find((e) => e.key === openKey);
    if (open)
      return html`<${EventPage}
          ...${shared}
          event=${open}
          onBack=${() => goTo(null)}
          onEdit=${() => setEditing(open)}
        />${form}`;

    const mine = (e) => answersOf(e).get(me)?.body.status;
    const ended = (e) => when.endOf(e.body) <= now;
    const inView =
      view === 'past'
        ? events.filter((e) => ended(e) && browsable(e)).reverse()
        : view === 'mine'
          ? events.filter((e) => !ended(e) && (mine(e) === 'going' || mine(e) === 'maybe'))
          : view === 'hosting'
            ? events.filter((e) => e.createdBy === me)
            : events.filter((e) => !ended(e) && browsable(e));
    const shown = kind ? inView.filter((e) => kindOf(e.body.category).id === kind) : inView;
    const kindsHere = KINDS.filter((k) => events.some((e) => kindOf(e.body.category).id === k.id));

    return html`<main>
      <div class="row" data-spread>
        <div role="tablist" aria-label="Events">
          ${VIEWS.map(
            (v) =>
              html`<button
                key=${v.id}
                role="tab"
                aria-selected=${view === v.id}
                onClick=${() => setView(v.id)}
              >
                ${v.label}
              </button>`,
          )}
        </div>
        ${mayCreate && events.length > 0 && html`<button data-intent="primary" onClick=${() => setEditing('new')}>+ Create event</button>`}
      </div>
      ${
        view !== 'mine' &&
        view !== 'hosting' &&
        html`<div class="row" data-gap="tight">
          <${NearButton} near=${near} onChange=${setNear} />
          ${
            view !== 'calendar' &&
            kindsHere.length > 1 &&
            html`<button aria-pressed=${kind === null} onClick=${() => setKind(null)}>All</button>
              ${kindsHere.map(
                (k) =>
                  html`<button
                    key=${k.id}
                    aria-pressed=${kind === k.id}
                    onClick=${() => setKind(kind === k.id ? null : k.id)}
                  >
                    <span aria-hidden="true">${k.emoji}</span> ${k.label}
                  </button>`,
              )}`
          }
        </div>`
      }
      ${
        view === 'calendar'
          ? html`<${MonthView} ...${shared} events=${events.filter(browsable)} />`
          : shown.length === 0
            ? html`<${Empty}
                view=${view}
                mayCreate=${mayCreate}
                filtered=${!!kind}
                onCreate=${() => setEditing('new')}
              />`
            : view === 'upcoming' && !kind
              ? html`<${Upcoming} ...${shared} events=${shown} />`
              : html`<div class="grid">
                  ${shown.map((e) => html`<${EventCard} key=${e.key} ...${shared} event=${e} />`)}
                </div>`
      }
      ${form}
    </main>`;
  }

  /** What's on: the very next thing large, then the rest by how soon */
  function Upcoming({ events, ...shared }) {
    const [next, ...rest] = events;
    const groups = new Map();
    for (const e of rest) {
      const label = when.horizon(when.dateOf(e.body.start), shared.now);
      groups.set(label, [...(groups.get(label) ?? []), e]);
    }
    return html`<${Hero} ...${shared} event=${next} /> ${[...groups].map(
        ([label, list]) =>
          html`<section key=${label}>
            <h2>${label}</h2>
            <div class="grid">
              ${list.map((e) => html`<${EventCard} key=${e.key} ...${shared} event=${e} />`)}
            </div>
          </section>`,
      )}`;
  }

  /** The next event, given the room to sell itself */
  function Hero({ event, now, answersOf, onOpen }) {
    const mayAnswer = useCan('create', RSVP);
    const { body } = event;
    const live = when.dateOf(body.start) <= now;
    const answers = answersOf(event);
    const going = [...answers.values()].filter((a) => a.body.status === 'going').map((a) => a.createdBy);
    return html`<section>
      <h2>${live ? 'Happening now' : `Next up · ${when.horizon(when.dateOf(body.start), now)}`}</h2>
      <button data-intent="open" onClick=${() => onOpen(event)}>
        <${EventCover} event=${event} size=${96}>
          <${DateTile} at=${body.start} />
          ${body.status === 'cancelled' && html`<span class="tag" data-tone="danger">Cancelled</span>`}
        </${EventCover}>
        <strong>${body.title}</strong>
        <small>🕒 ${when.longWhen(body)}</small>
        ${placeLabel(body.place) && html`<small>📍 ${placeLabel(body.place)}</small>`}
      </button>
      <div class="row" data-spread>
        <span class="row" data-gap="tight">
          ${going.slice(0, 5).map((did) => html`<${Avatar} key=${did} did=${did} size=${24} round />`)}
          <small>${headcount(answers)}</small>
        </span>
        ${mayAnswer && body.status !== 'cancelled' && html`<${RsvpButtons} event=${event} answers=${answers} compact />`}
      </div>
    </section>`;
  }

  /** An event in a grid: cover and date, what and where, and who's coming */
  function EventCard({ event, now, near, answersOf, onOpen }) {
    const mayAnswer = useCan('create', RSVP);
    const { body } = event;
    const answers = answersOf(event);
    const mine = answers.get(me);
    const past = when.endOf(body) <= now;
    const interested = mine?.body.status === 'maybe' || mine?.body.status === 'going';
    const where = [placeLabel(body.place), distanceText(near, body.place)].filter(Boolean).join(' · ');
    return html`<div class="stack" data-gap="tight">
      <button data-intent="open" onClick=${() => onOpen(event)}>
        <${EventCover} event=${event} size=${52}>
          <${DateTile} at=${body.start} />
          ${body.status === 'cancelled' && html`<span class="tag" data-tone="danger">Cancelled</span>`}
        </${EventCover}>
        <small>${when.shortWhen(body)}</small>
        <strong>${body.title}</strong>
        ${placeLabel(body.place) && html`<small class="truncate">${where}</small>`}
        <small>${headcount(answers) || 'Be the first to answer'}</small>
      </button>
      ${
        mayAnswer &&
        !past &&
        body.status !== 'cancelled' &&
        html`<div class="row">
          <button
            data-intent="ghost"
            aria-pressed=${interested}
            title=${interested ? 'You answered' : 'Show you are interested'}
            onClick=${() => answer(event, mine, interested ? null : 'maybe')}
          >
            ${mine?.body.status === 'going' ? '✓ Going' : interested ? '★ Interested' : '☆ Interested'}
          </button>
        </div>`
      }
    </div>`;
  }

  /** One event's own page */
  function EventPage({ event, now, near, answersOf, onBack, onEdit }) {
    const mayAnswer = useCan('create', RSVP);
    const [confirmDelete, setConfirmDelete] = useState(false);
    const { body } = event;
    const k = kindOf(body.category);
    const hosting = event.mine;
    const past = when.endOf(body) <= now;
    const cancelled = body.status === 'cancelled';
    const away = distanceText(near, body.place);
    const answers = answersOf(event);
    return html`<main>
      <${EventCover} event=${event} size=${120}><${DateTile} at=${body.start} /></${EventCover}>
      <header>
        <div class="stack" data-gap="tight">
          <small>${when.longWhen(body)}</small>
          <h1>${body.title}</h1>
          ${placeLabel(body.place) && html`<small>${placeLabel(body.place)}</small>`}
        </div>
        ${cancelled && html`<span class="tag" data-tone="danger">Cancelled</span>`}
        ${past && !cancelled && html`<span class="tag">Ended</span>`}
      </header>
      <div class="row" data-spread>
        ${mayAnswer && !past && !cancelled && html`<${RsvpButtons} event=${event} answers=${answers} />`}
        <button onClick=${() => download(event)}>Add to calendar</button>
        ${
          hosting &&
          html`<button onClick=${onEdit}>Edit</button>
            ${
              !past &&
              html`<button
                onClick=${() => minca.update(event.key, { ...body, status: cancelled ? 'confirmed' : 'cancelled' })}
              >
                ${cancelled ? 'Restore event' : 'Cancel event'}
              </button>`
            }
            <button
              data-intent="danger"
              onBlur=${() => setConfirmDelete(false)}
              onClick=${() => {
                if (!confirmDelete) return setConfirmDelete(true);
                onBack();
                minca.remove(event.key);
              }}
            >
              ${confirmDelete ? 'Delete for everyone?' : 'Delete'}
            </button>`
        }
      </div>
      <section>
        <h3>Details</h3>
        <ul role="list">
          <li><span aria-hidden="true">👤</span> Hosted by <${Person} did=${event.createdBy} face=${false} /></li>
          <li><span aria-hidden="true">${k.emoji}</span> ${k.label}</li>
          <li><span aria-hidden="true">🕒</span> ${when.longWhen(body)}</li>
          ${
            placeLabel(body.place) &&
            html`<li class="row" data-spread>
              <span
                ><span aria-hidden="true">📍</span>
                ${placeLabel(body.place)}${away && html`<small> · ${away} away</small>`}</span
              >
              <${MapLink} place=${body.place} />
            </li>`
          }
          ${
            body.url &&
            html`<li class="truncate">
              <span aria-hidden="true">🔗</span>
              <a
                href=${body.url}
                onClick=${(e) => {
                  e.preventDefault();
                  minca.link(body.url);
                }}
                >${body.url.replace(/^https?:\/\//, '')}</a
              >
            </li>`
          }
        </ul>
        ${body.description && paragraphs(body.description)}
      </section>
      <${Guests} answers=${answers} />
      <${Comments} about=${event} />
    </main>`;
  }

  /** Who answered, by answer */
  function Guests({ answers }) {
    const all = [...answers.values()];
    return html`<section>
      <h3>Guests</h3>
      <div class="row" data-gap="tight">
        <span class="tag">${countOf(answers, 'going')} going</span>
        <span class="tag">${all.filter((a) => a.body.status === 'maybe').length} interested</span>
      </div>
      ${ANSWERS.map(({ status, label }) => {
        const these = all.filter((a) => a.body.status === status);
        if (these.length === 0) return null;
        return html`<div key=${status} class="stack" data-gap="tight">
          <small>${label} · ${these.length}</small>
          <ul role="list">
            ${these.map(
              (a) =>
                html`<li key=${a.key} class="row">
                  <${Person} did=${a.createdBy} size=${24} />
                  ${!!a.body.guests && html`<small>+${a.body.guests}</small>`}
                </li>`,
            )}
          </ul>
        </div>`;
      })}
      ${all.length === 0 && html`<p><small>Nobody has answered yet.</small></p>`}
    </section>`;
  }

  /** Going, Interested, Can't go: one answer per person, and choosing yours again takes it back */
  function RsvpButtons({ event, answers, compact }) {
    const mine = answers.get(me);
    return html`<div class="row" data-gap="tight">
      ${ANSWERS.map(({ status, label, on }) => {
        const chosen = mine?.body.status === status;
        return html`<button
          key=${status}
          aria-pressed=${chosen}
          onClick=${() => answer(event, mine, chosen ? null : status)}
        >
          ${chosen ? on : label}
        </button>`;
      })}
      ${
        mine?.body.status === 'going' &&
        !compact &&
        html`<span>
          <select
            aria-label="Bringing"
            value=${mine.body.guests ?? 0}
            onChange=${(e) => minca.update(mine.key, { ...mine.body, guests: Number(e.currentTarget.value) })}
          >
            ${[0, 1, 2, 3, 4, 5].map((n) => html`<option key=${n} value=${n}>${n === 0 ? 'Bringing nobody' : `Bringing +${n}`}</option>`)}
          </select>
        </span>`
      }
    </div>`;
  }

  /** A month at a glance: every day, and what is on it */
  function MonthView({ events, now, answersOf, onOpen }) {
    const today = when.startOfDay(now);
    const [month, setMonth] = useState(() => new Date(today.getFullYear(), today.getMonth(), 1));
    const [picked, setPicked] = useState(today);
    // Weeks start on Monday; six rows hold any month.
    const first = when.addDays(month, -((month.getDay() + 6) % 7));
    const days = Array.from({ length: 42 }, (_, i) => when.addDays(first, i));
    const on = (day) => events.filter((e) => when.isOn(e.body, day));
    const shift = (by) => setMonth(new Date(month.getFullYear(), month.getMonth() + by, 1));
    const pickedEvents = on(picked);
    return html`<section>
      <header>
        <h2>${month.toLocaleDateString(undefined, { month: 'long', year: 'numeric' })}</h2>
        <button
          onClick=${() => {
            setMonth(new Date(today.getFullYear(), today.getMonth(), 1));
            setPicked(today);
          }}
        >
          Today
        </button>
        <button data-icon aria-label="Previous month" onClick=${() => shift(-1)}>‹</button>
        <button data-icon aria-label="Next month" onClick=${() => shift(1)}>›</button>
      </header>
      <div role="grid" aria-label="Month">
        ${days.slice(0, 7).map((d) => html`<small key=${d} role="columnheader">${d.toLocaleDateString(undefined, { weekday: 'short' })}</small>`)}
        ${days.map((day) => {
          const these = on(day);
          const number =
            when.dayKey(day) === when.dayKey(today)
              ? html`<mark>${day.getDate()}</mark>`
              : day.getMonth() !== month.getMonth()
                ? html`<small>${day.getDate()}</small>`
                : html`<strong>${day.getDate()}</strong>`;
          return html`<div
            key=${when.dayKey(day)}
            role="gridcell"
            aria-selected=${when.dayKey(day) === when.dayKey(picked)}
            onClick=${() => setPicked(day)}
          >
            <span>${number}</span>
            ${these.slice(0, 3).map(
              (e) =>
                html`<button
                  key=${e.key}
                  class="tag"
                  data-hue=${HUES[kindOf(e.body.category).colour]}
                  title=${e.body.title}
                  onClick=${(click) => {
                    click.stopPropagation();
                    onOpen(e);
                  }}
                >
                  <span class="truncate">
                    ${when.isWholeDay(e.body.start) || e.body.allDay ? '' : `${when.clockOf(when.dateOf(e.body.start))} `}${e.body.status === 'cancelled' ? html`<s>${e.body.title}</s>` : e.body.title}
                  </span>
                </button>`,
            )}
            ${these.length > 3 && html`<small>+${these.length - 3} more</small>`}
            ${
              these.length > 0 &&
              html`<span class="row" data-gap="tight" aria-hidden="true"
                >${these.slice(0, 3).map((e) => html`<${Shape} key=${e.key} kind="squircle" colour=${kindOf(e.body.category).colour} size=${8} />`)}</span
              >`
            }
          </div>`;
        })}
      </div>
      <h3>${picked.toLocaleDateString(undefined, { weekday: 'long', day: 'numeric', month: 'long' })}</h3>
      ${
        pickedEvents.length === 0
          ? html`<p><small>Nothing on this day.</small></p>`
          : html`<ul role="list">
              ${pickedEvents.map(
                (e) =>
                  html`<li key=${e.key}>
                    <button data-intent="open" onClick=${() => onOpen(e)}>
                      <strong class="truncate">${e.body.title}</strong>
                      <small class="truncate"
                        >${when.shortWhen(e.body)}${placeLabel(e.body.place) ? ` · ${placeLabel(e.body.place)}` : ''}${headcount(answersOf(e)) ? ` · ${headcount(answersOf(e))}` : ''}</small
                      >
                    </button>
                  </li>`,
              )}
            </ul>`
      }
    </section>`;
  }

  /** Making an event, or changing one: what, when, where */
  function EventForm({ initial, near, onSave, onClose }) {
    const was = initial?.body;
    const [start] = useState(() =>
      was ? when.dateOf(was.start) : when.addDays(when.startOfDay(new Date()), 1),
    );
    const end = was?.end ? when.dateOf(was.end) : null;
    const [title, setTitle] = useState(was?.title ?? '');
    const [category, setCategory] = useState(was ? kindOf(was.category).id : 'meetup');
    const [allDay, setAllDay] = useState(was ? !!was.allDay || when.isWholeDay(was.start) : false);
    const [day, setDay] = useState(when.dayKey(start));
    const [clock, setClock] = useState(was && !when.isWholeDay(was.start) ? when.clockOf(start) : '19:00');
    const [endDay, setEndDay] = useState(end ? when.dayKey(end) : '');
    const [endClock, setEndClock] = useState(end && !when.isWholeDay(was.end) ? when.clockOf(end) : '');
    const [place, setPlace] = useState(was?.place);
    const [url, setUrl] = useState(was?.url ?? '');
    const [description, setDescription] = useState(was?.description ?? '');
    // A photo picked here, kept once the event is saved; shown from this device until then.
    const [photo, setPhoto] = useState(null);
    const [picked, setPicked] = useState(null);
    const current = useCoverPhoto(initial);
    const shown = picked ?? current;
    const [busy, setBusy] = useState(false);
    const [error, setError] = useState(null);

    const startAt = allDay ? day : day && clock ? when.rfc3339(when.fromInputs(day, clock)) : '';
    const endAt = allDay
      ? endDay && endDay > day
        ? endDay
        : ''
      : endClock
        ? when.rfc3339(when.fromInputs(endDay || day, endClock))
        : '';
    const backwards = !!endAt && !allDay && when.dateOf(endAt) <= when.dateOf(startAt);
    const badUrl = !!url.trim() && !/^https?:\/\/\S+$/.test(url.trim());
    const ready = !!title.trim() && !!startAt && !backwards && !badUrl;
    const value = (set) => (e) => set(e.currentTarget.value);

    return html`<${Modal} title=${initial ? 'Edit event' : 'Create event'} onClose=${onClose} width=${560}>
      <form
        class="stack"
        data-gap="loose"
        onSubmit=${(e) => {
          e.preventDefault();
          if (!ready) return;
          setBusy(true);
          setError(null);
          onSave(
            {
              title: title.trim(),
              category,
              start: startAt,
              ...(endAt ? { end: endAt } : {}),
              ...(allDay ? { allDay: true } : { tz: when.localZone() }),
              ...(place ? { place } : {}),
              ...(url.trim() ? { url: url.trim() } : {}),
              ...(description.trim() ? { description: description.trim() } : {}),
              ...(was?.status ? { status: was.status } : {}),
              ...(was?.rrule ? { rrule: was.rrule } : {}),
            },
            photo,
          )
            .catch((e) => setError(e.message))
            .finally(() => setBusy(false));
        }}
      >
        ${shown && html`<${Cover} seed=${initial?.key ?? 'new'} colour=${kindOf(category).colour} wide><img src=${shown} alt="" /></${Cover}>`}
        <label>
          ${shown ? 'Change photo' : 'Cover photo'}
          <input
            type="file"
            accept="image/*"
            onChange=${(e) => {
              const file = e.currentTarget.files?.[0];
              if (!file) return;
              setPhoto(file);
              setPicked(URL.createObjectURL(file));
            }}
          />
        </label>
        <label>Name
          <input value=${title} onInput=${value(setTitle)} placeholder="Summer concert in the park" maxlength="500" />
        </label>
        <fieldset>
          <legend>Kind</legend>
          <div class="row" data-gap="tight">
            ${KINDS.map(
              (k) =>
                html`<button
                  key=${k.id}
                  type="button"
                  aria-pressed=${category === k.id}
                  onClick=${() => setCategory(k.id)}
                >
                  <span aria-hidden="true">${k.emoji}</span> ${k.label}
                </button>`,
            )}
          </div>
        </fieldset>
        <div class="grid">
          <label>Starts<input type="date" value=${day} onInput=${value(setDay)} /></label>
          ${!allDay && html`<label>At<input type="time" value=${clock} onInput=${value(setClock)} /></label>`}
        </div>
        <div class="grid">
          <label>Ends (optional)<input type="date" value=${endDay} min=${day} onInput=${value(setEndDay)} /></label>
          ${!allDay && html`<label>At<input type="time" value=${endClock} onInput=${value(setEndClock)} /></label>`}
        </div>
        <label><input type="checkbox" checked=${allDay} onChange=${(e) => setAllDay(e.currentTarget.checked)} /> All day</label>
        ${backwards && html`<p role="alert">It ends before it starts.</p>`}
        <label>Where
          <${PlaceField} value=${place} onChange=${setPlace} near=${near} placeholder="A venue, an address, a park" />
        </label>
        <label>Link (tickets, stream, page)
          <input value=${url} onInput=${value(setUrl)} placeholder="https://" inputmode="url" />
        </label>
        ${badUrl && html`<p role="alert">A link starts with https://</p>`}
        <label>About
          <textarea rows="4" maxlength="10000" value=${description} onInput=${value(setDescription)} placeholder="What to expect, what to bring, who's playing"></textarea>
        </label>
        ${error && html`<p role="alert">${error}</p>`}
        <div class="row" data-spread>
          <button type="button" data-intent="ghost" onClick=${onClose}>Cancel</button>
          <button type="submit" data-intent="primary" disabled=${!ready || busy}>${busy ? 'Saving…' : initial ? 'Save' : 'Create event'}</button>
        </div>
      </form>
    </${Modal}>`;
  }

  /** Nothing to show, said for the tab it is on */
  function Empty({ view, mayCreate, filtered, onCreate }) {
    const said = {
      upcoming: 'Nothing coming up yet',
      mine: "You haven't said you're going to anything",
      hosting: "You aren't hosting anything",
      past: 'No past events',
    };
    return html`<${ui.Empty} shape="calendar" colour="sage" title=${filtered ? 'Nothing of this kind here' : said[view]}>
      ${mayCreate && (view === 'upcoming' || view === 'hosting') && !filtered && html`<button data-intent="primary" onClick=${onCreate}>Create an event</button>`}
    </${ui.Empty}>`;
  }

  /** The day it starts, in a cover's corner */
  function DateTile({ at }) {
    const date = when.dateOf(at);
    return html`<span class="tag">
      ${date.toLocaleDateString(undefined, { month: 'short' }).replace('.', '')} ${date.getDate()}
    </span>`;
  }

  render(html`<${Events} />`);
</script>
