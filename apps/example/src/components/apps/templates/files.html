<!-- Files: every std.file in the space, by kind, size and name, in categories that are std.lists with an item about each file. -->
<script>
  const {
    html,
    render,
    useState,
    useEffect,
    useMemo,
    useRef,
    useRecords,
    useCan,
    useFile,
    useBlob,
    useShown,
  } = ui;
  const { Icon } = ui;
  const { useSeen, Avatar, Person, Empty, Modal, attach, sizeOf, ago } = ui;
  const FILE = 'std.file';
  const LIST = 'std.list';
  const ITEM = 'std.list-item';
  /** Lists shown as categories even when empty; any other list shows once a file is in it, like a photo app's album */
  const GROUPS = ['category', 'folder', 'album'];
  /** What a card carries when it is dragged onto a category */
  const DRAGGED = 'application/x-minca-file';
  /** A video's whole file is fetched for its card only up to this size */
  const THUMB_VIDEO = 10_000_000;

  const KINDS = [
    ['picture', 'Pictures', '🖼', (m) => m.startsWith('image/')],
    ['video', 'Videos', '🎬', (m) => m.startsWith('video/')],
    ['audio', 'Sound', '🎵', (m) => m.startsWith('audio/')],
    [
      'document',
      'Documents',
      '📄',
      (m) =>
        m.startsWith('text/') ||
        /pdf|word|officedocument|opendocument|rtf|json|csv|presentation|sheet/.test(m),
    ],
    ['archive', 'Archives', '🗜', (m) => /zip|tar|7z|rar|compressed/.test(m)],
    ['other', 'Other', '📎', () => true],
  ];
  const kindOf = (mime = '') => KINDS.find(([, , , is]) => is(mime));
  const extOf = (name) => /\.([a-z0-9]{1,5})$/i.exec(name)?.[1]?.toUpperCase() ?? '';
  /** Text worth showing as it is, when not too long */
  const isText = (mime) => /^text\/|json|csv|xml|javascript/.test(mime);

  const SORTS = {
    newest: ['Newest', (a, b) => b.createdAt.localeCompare(a.createdAt)],
    oldest: ['Oldest', (a, b) => a.createdAt.localeCompare(b.createdAt)],
    largest: ['Largest', (a, b) => (b.body.size ?? 0) - (a.body.size ?? 0)],
    smallest: ['Smallest', (a, b) => (a.body.size ?? 0) - (b.body.size ?? 0)],
    name: ['Name', (a, b) => a.body.name.localeCompare(b.body.name)],
  };

  /** A category's colour, one of the five hues, the same on every device, from its key */
  const hueOf = (key) => String(([...key].reduce((h, c) => (h * 31 + c.charCodeAt(0)) >>> 0, 7) % 5) + 1);

  /** Where a record's link of this role points, if it has one */
  const linkOf = (record, rel) => record.links.find((l) => l.rel === rel)?.to;

  /** Files dropped anywhere on the screen, or pasted wherever the focus is */
  function useIncoming(onFiles) {
    const [dropping, setDropping] = useState(false);
    const latest = useRef(onFiles);
    latest.current = onFiles;
    useEffect(() => {
      let depth = 0;
      // A card dragged within the screen carries its picture as a file too: that is a move, not an upload.
      const carriesFiles = (event) =>
        event.dataTransfer?.types.includes('Files') && !event.dataTransfer.types.includes(DRAGGED);
      const done = () => {
        depth = 0;
        setDropping(false);
      };
      const on = {
        dragenter: (event) => {
          if (!carriesFiles(event)) return;
          event.preventDefault();
          depth += 1;
          setDropping(true);
        },
        dragover: (event) => carriesFiles(event) && event.preventDefault(),
        dragleave: (event) => carriesFiles(event) && --depth <= 0 && done(),
        drop: (event) => {
          if (!carriesFiles(event)) return;
          event.preventDefault();
          done();
          latest.current([...event.dataTransfer.files]);
        },
        dragend: done,
        paste: (event) => {
          const data = event.clipboardData;
          const pasted = data?.files.length
            ? [...data.files]
            : [...(data?.items ?? [])]
                .map((item) => item.kind === 'file' && item.getAsFile())
                .filter(Boolean);
          if (!pasted.length) return;
          event.preventDefault();
          latest.current(pasted);
        },
      };
      for (const [name, listener] of Object.entries(on)) document.addEventListener(name, listener);
      addEventListener('blur', done);
      return () => {
        for (const [name, listener] of Object.entries(on)) document.removeEventListener(name, listener);
        removeEventListener('blur', done);
      };
    }, []);
    return dropping;
  }

  function Files() {
    const files = useRecords(FILE);
    const lists = useRecords(LIST);
    const items = useRecords(ITEM);
    const mayAdd = useCan('create', FILE);
    const mayGroup = useCan('create', ITEM);
    const mayMake = useCan('create', LIST);
    // { kind: 'all' } | { kind: 'type', type } | { kind: 'group', key }
    const [view, setView] = useState({ kind: 'all' });
    const [sort, setSort] = useState('newest');
    const [query, setQuery] = useState('');
    const [opened, setOpened] = useState(null);
    const [busy, setBusy] = useState(false);
    const [error, setError] = useState(null);
    const [naming, setNaming] = useState(null);
    const picker = useRef(null);
    // A file opened from elsewhere, like one in a chat: shown in the viewer, among all files.
    const asked = useShown();
    useEffect(() => {
      if (!asked) return;
      setView({ kind: 'all' });
      setQuery('');
      setOpened(asked.key);
    }, [asked]);

    const all = files ?? [];
    const keys = useMemo(() => new Set(all.map((f) => f.key)), [files]);
    // File key → the items putting it in a list
    const itemsOn = useMemo(() => {
      const on = new Map();
      for (const item of items ?? []) {
        const key = linkOf(item, 'about');
        if (keys.has(key)) on.set(key, [...(on.get(key) ?? []), item]);
      }
      return on;
    }, [items, keys]);
    const groupsOf = (key) => [...new Set((itemsOn.get(key) ?? []).map((item) => linkOf(item, 'in')))];
    const counts = useMemo(() => {
      const byList = new Map();
      for (const [key] of itemsOn)
        for (const list of groupsOf(key)) byList.set(list, (byList.get(list) ?? 0) + 1);
      return byList;
    }, [itemsOn]);
    const groups = (lists ?? [])
      .filter((list) => GROUPS.includes(list.body.kind) || counts.has(list.key))
      .sort((a, b) => a.body.title.localeCompare(b.body.title));
    const group = view.kind === 'group' ? groups.find((g) => g.key === view.key) : null;

    const shown = useMemo(() => {
      const text = query.trim().toLowerCase();
      return all
        .filter((f) =>
          view.kind === 'type'
            ? kindOf(f.body.mime)[0] === view.type
            : view.kind === 'group'
              ? groupsOf(f.key).includes(view.key)
              : true,
        )
        .filter((f) => !text || f.body.name.toLowerCase().includes(text))
        .sort(SORTS[sort][1]);
    }, [files, itemsOn, view, sort, query]);

    const fail = (e) => setError(e.message ?? String(e));

    /** Puts a file in a category, unless it is in it already */
    const putIn = async (key, list) => {
      if (groupsOf(key).includes(list)) return;
      await minca.put(
        ITEM,
        {},
        {
          links: [
            { rel: 'in', to: list },
            { rel: 'about', to: key },
          ],
        },
      );
    };
    /** Takes a file out of a category: every item saying so that the person looking may remove */
    const takeOut = async (key, list) => {
      let refused = false;
      for (const item of itemsOn.get(key) ?? [])
        if (linkOf(item, 'in') === list) await minca.remove(item.key).catch(() => (refused = true));
      if (refused) setError('Only whoever put it there, or a moderator, can take it out.');
    };

    const upload = async (list) => {
      if (!list.length || !mayAdd) return;
      setBusy(true);
      setError(null);
      try {
        const written = await attach(null, list);
        // Added while a category is open, they go in it.
        if (group && mayGroup) for (const file of written) await putIn(file.key, group.key);
      } catch (e) {
        fail(e);
      } finally {
        setBusy(false);
      }
    };
    const dropping = useIncoming(upload);

    const remove = async (file) => {
      setOpened(null);
      try {
        for (const item of itemsOn.get(file.key) ?? [])
          if (item.mine) await minca.remove(item.key).catch(() => {});
        await minca.remove(file.key);
      } catch (e) {
        fail(e);
      }
    };
    const makeGroup = async (title) => {
      try {
        const made = await minca.put(LIST, { title, kind: 'category' });
        setView({ kind: 'group', key: made.key });
      } catch (e) {
        fail(e);
      }
    };
    // The files in it are left as they are, in no category.
    const dropGroup = async (list) => {
      try {
        await minca.remove(list.key);
        setView({ kind: 'all' });
      } catch {
        setError('Only whoever made this category, or a moderator, can remove it.');
      }
    };

    if (!files) return null;
    const total = shown.reduce((sum, f) => sum + (f.body.size ?? 0), 0);
    const title =
      view.kind === 'type' ? KINDS.find(([k]) => k === view.type)[1] : group ? group.body.title : 'All files';
    const at = shown.findIndex((f) => f.key === opened);

    return html`<main data-wide>
      <header>
        <div>
          <h1>${title}</h1>
          <small>${shown.length} · ${sizeOf(total)}</small>
        </div>
        ${
          group?.mine &&
          html`<button type="button" data-intent="ghost" onClick=${() => dropGroup(group)}>
            Remove category
          </button>`
        }
        ${
          mayAdd &&
          html`<button
              type="button"
              data-intent="primary"
              disabled=${busy}
              onClick=${() => picker.current?.click()}
            >
              ${busy ? 'Uploading…' : 'Upload'}
            </button>
            <input
              ref=${picker}
              type="file"
              multiple
              hidden
              onChange=${(event) => {
                upload([...event.currentTarget.files]);
                event.currentTarget.value = '';
              }}
            />`
        }
      </header>
      <section>
        <div class="row">
          <input
            type="search"
            placeholder="Search files"
            aria-label="Search files"
            value=${query}
            onInput=${(event) => setQuery(event.currentTarget.value)}
          />
          <select aria-label="Sort" value=${sort} onChange=${(event) => setSort(event.currentTarget.value)}>
            ${Object.entries(SORTS).map(([key, [name]]) => html`<option value=${key}>${name}</option>`)}
          </select>
        </div>
        <nav class="row" data-gap="tight" aria-label="Files">
          <${Place}
            on=${view.kind === 'all'}
            label="🗂 All files"
            count=${all.length}
            onClick=${() => setView({ kind: 'all' })}
          />
          ${KINDS.map(([type, name, icon]) => {
            const count = all.filter((f) => kindOf(f.body.mime)[0] === type).length;
            return (
              count > 0 &&
              html`<${Place}
                key=${type}
                on=${view.kind === 'type' && view.type === type}
                label=${`${icon} ${name}`}
                count=${count}
                onClick=${() => setView({ kind: 'type', type })}
              />`
            );
          })}
          ${groups.map(
            (list) =>
              html`<${Place}
                key=${list.key}
                on=${view.kind === 'group' && view.key === list.key}
                label=${list.body.title}
                hue=${hueOf(list.key)}
                count=${counts.get(list.key)}
                onClick=${() => setView({ kind: 'group', key: list.key })}
                onFile=${mayGroup && ((key) => putIn(key, list.key))}
                onError=${setError}
              />`,
          )}
          ${
            naming !== null &&
            html`<form
              onSubmit=${(event) => {
                event.preventDefault();
                const title = naming.trim().slice(0, 200);
                setNaming(null);
                if (title) makeGroup(title);
              }}
            >
              <${Focused}
                value=${naming}
                placeholder="Name it"
                aria-label="Category name"
                onInput=${(event) => setNaming(event.currentTarget.value)}
                onBlur=${(event) => !event.currentTarget.value.trim() && setNaming(null)}
              />
            </form>`
          }
          ${
            mayMake &&
            naming === null &&
            html`<button
              type="button"
              data-intent="ghost"
              data-icon
              title="New category"
              aria-label="New category"
              onClick=${() => setNaming('')}
            >
              <${Icon} name="plus" />
            </button>`
          }
        </nav>
        ${error && html`<p role="alert">${error}</p>`}
        ${dropping && html`<aside>Drop files to add them${group ? ` to “${group.body.title}”` : ''}</aside>`}
        ${
          shown.length === 0
            ? query
              ? html`<${Empty} shape="folder" colour="sage" title="Nothing by that name" />`
              : group
                ? html`<${Empty}
                    shape="folder"
                    colour="sage"
                    title="Nothing in this category yet"
                    text="Drag files onto it, or drop new ones here."
                  />`
                : html`<${Empty}
                    shape="folder"
                    colour="sage"
                    title="No files yet"
                    text="Drop some here, paste them, or share them in a chat."
                  />`
            : html`<div class="grid">
                ${shown.map(
                  (file) =>
                    html`<${Card}
                      key=${file.key}
                      file=${file}
                      groups=${groups.filter((g) => groupsOf(file.key).includes(g.key))}
                      onOpen=${() => setOpened(file.key)}
                    />`,
                )}
              </div>`
        }
      </section>
      ${
        at >= 0 &&
        html`<${Viewer}
          key=${opened}
          file=${shown[at]}
          groups=${groups}
          on=${groupsOf(opened)}
          mayGroup=${mayGroup}
          onGroup=${(list, add) => (add ? putIn(opened, list) : takeOut(opened, list)).catch(fail)}
          onStep=${(by) => shown[at + by] && setOpened(shown[at + by].key)}
          hasPrevious=${at > 0}
          hasNext=${at < shown.length - 1}
          onDelete=${() => remove(shown[at])}
          onClose=${() => setOpened(null)}
        />`
      }
    </main>`;
  }

  /** A text field that takes the focus when it appears; autofocus only works as the page loads */
  function Focused(props) {
    const input = useRef(null);
    useEffect(() => input.current?.focus(), []);
    return html`<input ref=${input} ...${props} />`;
  }

  /** A place to look in, as a filter; a category, in its colour, also takes a file dragged onto it */
  function Place({ on, label, hue, count, onClick, onFile, onError }) {
    const [target, setTarget] = useState(false);
    return html`<button
      type="button"
      aria-pressed=${on}
      data-marked=${target}
      onClick=${onClick}
      onDragOver=${
        onFile &&
        ((event) => {
          if (!event.dataTransfer.types.includes(DRAGGED)) return;
          event.preventDefault();
          setTarget(true);
        })
      }
      onDragLeave=${() => setTarget(false)}
      onDrop=${
        onFile &&
        ((event) => {
          const key = event.dataTransfer.getData(DRAGGED);
          setTarget(false);
          if (!key) return;
          event.preventDefault();
          onFile(key).catch((e) => onError(e.message));
        })
      }
    >
      ${label} ${count > 0 && html`<span class="tag" data-hue=${hue}>${count}</span>`}
    </button>`;
  }

  /** A file in the grid: a picture of it where there can be one, its name, size, age and categories */
  function Card({ file, groups, onOpen }) {
    const { name, mime, size, blob } = file.body;
    const [kind, , icon] = kindOf(mime);
    const box = useRef(null);
    const seen = useSeen(box);
    const picture = useFile(file.key, seen && kind === 'picture' ? blob : null);
    const clip = useBlob(file.key, seen && kind === 'video' && size <= THUMB_VIDEO ? blob : null);
    return html`<button
      ref=${box}
      type="button"
      data-intent="open"
      title=${name}
      draggable="true"
      onDragStart=${(event) => event.dataTransfer.setData(DRAGGED, file.key)}
      onClick=${onOpen}
    >
      <figure aria-hidden="true">
        ${
          picture
            ? html`<img src=${picture} alt="" loading="lazy" />`
            : clip
              ? html`<video src=${`${clip}#t=0.1`} muted playsinline preload="metadata"></video>`
              : html`<span>${icon}</span>`
        }
        ${clip && html`<span class="tag">▶</span>`}
      </figure>
      <strong class="truncate">${name}</strong>
      <span class="row" data-gap="tight">
        ${file.createdBy && html`<${Avatar} did=${file.createdBy} size=${16} round />`}
        <small>${[extOf(name), sizeOf(size ?? 0), ago(file.createdAt)].filter(Boolean).join(' · ')}</small>
      </span>
      ${
        groups.length > 0 &&
        html`<span class="row" data-gap="tight">
          ${groups.map((g) => html`<span key=${g.key} class="tag" data-hue=${hueOf(g.key)}>${g.body.title}</span>`)}
        </span>`
      }
    </button>`;
  }

  /** One file in a dialog: shown as well as it can be, ← and → to the next, Esc to close */
  function Viewer({ file, groups, on, mayGroup, onGroup, onStep, hasPrevious, hasNext, onDelete, onClose }) {
    const { name, mime, size, blob, url } = file.body;
    const [kind] = kindOf(mime);
    const picture = useFile(file.key, kind === 'picture' ? blob : null);
    const whole = useBlob(file.key, /^(picture|video|audio)$/.test(kind) ? blob : null);
    const [text, setText] = useState(null);
    const [sure, setSure] = useState(false);

    useEffect(() => {
      const keys = (event) => {
        if (event.target.closest?.('input, textarea, select')) return;
        if (event.key === 'Escape') onClose();
        else if (event.key === 'ArrowLeft') onStep(-1);
        else if (event.key === 'ArrowRight') onStep(1);
        else return;
        event.preventDefault();
      };
      addEventListener('keydown', keys);
      return () => removeEventListener('keydown', keys);
    }, [onClose, onStep]);
    useEffect(() => {
      if (!blob || !isText(mime) || size > 1_000_000) return;
      let live = true;
      minca
        .blob(file.key, blob.hash)
        .then((b) => b.text())
        .then(
          (t) => live && setText(t),
          () => {},
        );
      return () => {
        live = false;
      };
    }, [file.key]);

    const about = file.links.some((l) => l.rel === 'about');
    return html`<${Modal} title=${name} onClose=${onClose} width=${720}>
      <div class="row" data-spread>
        <span class="row" data-gap="tight">
          ${file.createdBy && html`<${Person} did=${file.createdBy} size=${20} />`}
          <small>${sizeOf(size ?? 0)} · ${ago(file.createdAt)}</small>
        </span>
        <button
          type="button"
          data-intent="ghost"
          data-icon
          aria-label="Previous"
          disabled=${!hasPrevious}
          onClick=${() => onStep(-1)}
        ><${Icon} name="arrowLeft" /></button>
        <button
          type="button"
          data-intent="ghost"
          data-icon
          aria-label="Next"
          disabled=${!hasNext}
          onClick=${() => onStep(1)}
        ><${Icon} name="arrow" /></button>
      </div>
      ${
        kind === 'picture' && (whole || picture)
          ? html`<img src=${whole ?? picture} alt=${name} />`
          : kind === 'video' && whole
            ? html`<video src=${whole} controls autoplay playsinline></video>`
            : kind === 'audio' && whole
              ? html`<audio src=${whole} controls autoplay></audio>`
              : text !== null
                ? html`<textarea readonly rows="16" aria-label=${name} value=${text}></textarea>`
                : html`<${Empty}
                    shape="folder"
                    colour="sage"
                    title=${blob ? (whole === null && /^(picture|video|audio)$/.test(kind) ? 'Loading…' : 'No preview') : 'Kept elsewhere'}
                  />`
      }
      ${
        groups.length > 0 &&
        html`<div class="row" data-gap="tight">
          ${groups.map(
            (g) =>
              html`<button
                type="button"
                key=${g.key}
                disabled=${!mayGroup}
                aria-pressed=${on.includes(g.key)}
                onClick=${() => onGroup(g.key, !on.includes(g.key))}
              >
                ${g.body.title}
              </button>`,
          )}
        </div>`
      }
      <div class="row" data-gap="tight">
        ${about && html`<button type="button" onClick=${() => minca.open({ record: file.key, link: 'about' })}>Where it was shared</button>`}
        ${
          blob
            ? html`<button type="button" onClick=${() => minca.download(file.key, blob.hash)}>
                Download
              </button>`
            : url && html`<button type="button" onClick=${() => minca.link(url)}>Open</button>`
        }
        ${
          file.mine &&
          (sure
            ? html`<button type="button" data-intent="danger" onClick=${onDelete}>Delete for everyone</button>
                <button type="button" data-intent="ghost" onClick=${() => setSure(false)}>Keep</button>`
            : html`<button type="button" data-intent="ghost" onClick=${() => setSure(true)}>Delete</button>`)
        }
      </div>
    </${Modal}>`;
  }

  render(html`<${Files} />`);
</script>
