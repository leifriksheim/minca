<!-- Kanban: std.task and std.column as a board, like a small Trello. Moving a card rewrites only its in link (to its column) and position: by dragging with a mouse, or from the card itself. A card opens one level in (minca.go), so the app's bar names it and its Back comes back out. A card's checklist is tasks whose parent is the card; they stay off the board. -->
<style>
  /* The whole window: a board scrolls sideways through its columns. */
  :root {
    --minca-page-width: none;
  }
  body {
    padding: 0;
  }
  .toolbar {
    padding: 14px 16px 0;
  }
  /* Columns side by side, scrolled across; a phone snaps to one column at a time, the next peeking in. */
  .board {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 14px 16px 24px;
    overflow-x: auto;
    overscroll-behavior-x: contain;
    scroll-snap-type: x proximity;
    scroll-padding-inline: 16px;
  }
  .lane,
  .new-column {
    flex: 0 0 280px;
    scroll-snap-align: start;
  }
  .lane {
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 10px;
    border: 1px solid var(--minca-rule);
    border-radius: var(--minca-radius-lg);
    background: var(--minca-sunken);
  }
  .lane > header {
    display: flex;
    align-items: center;
    gap: 6px;
    min-height: 32px;
    padding: 0 2px 0 4px;
  }
  .lane > header > button.name {
    flex: 1;
    justify-content: flex-start;
    min-height: 0;
    padding: 0;
    border: none;
    background: none;
    color: var(--minca-ink);
    font-size: 15px;
    font-weight: 600;
  }
  .lane > header > button.name:disabled {
    opacity: 1;
  }
  .lane > header form {
    flex: 1;
  }
  .lane > header > button[data-icon] {
    width: 28px;
    min-height: 28px;
  }
  .count {
    min-width: 22px;
    padding: 0 7px;
    border-radius: var(--minca-radius-pill);
    background: var(--minca-card);
    color: var(--minca-muted);
    font-size: 12px;
    text-align: center;
  }
  .lane-empty {
    padding: 14px 8px;
    border: 1.5px dashed var(--minca-line-strong);
    border-radius: var(--minca-radius-md);
    color: var(--minca-faint);
    font-size: 13px;
    text-align: center;
  }
  .task {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 8px;
    min-height: 0;
    padding: 12px 14px;
    border: 1px solid var(--minca-line);
    border-radius: var(--minca-radius-md);
    background: var(--minca-card);
    color: var(--minca-ink);
    font-size: 15px;
    font-weight: 500;
    line-height: 1.35;
    text-align: left;
    overflow-wrap: anywhere;
  }
  .task:hover {
    background: var(--minca-card);
    border-color: var(--minca-line-strong);
  }
  .task[draggable='true'] {
    cursor: grab;
  }
  .meta {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    font-size: 12px;
    font-weight: 400;
    color: var(--minca-muted);
  }
  .meta .faces {
    display: flex;
    gap: 2px;
    margin-left: auto;
  }
  .late {
    color: var(--minca-danger);
  }
  .pill {
    align-self: flex-start;
    padding: 1px 9px;
    border-radius: var(--minca-radius-pill);
    font-size: 11px;
    font-weight: 600;
    color: var(--minca-ink);
    background: color-mix(in srgb, var(--c, var(--minca-sunken)) 45%, var(--minca-card));
  }
  .marker {
    height: 3px;
    border-radius: var(--minca-radius-pill);
    background: var(--minca-accent);
  }
  .add {
    justify-content: flex-start;
    min-height: 40px;
    padding: 0 10px;
    border-radius: var(--minca-radius-md);
  }
  .new-column > button {
    width: 100%;
    min-height: 52px;
    border: 1.5px dashed var(--minca-line-strong);
    border-radius: var(--minca-radius-lg);
    background: none;
    color: var(--minca-muted);
  }
  .new-column > form {
    padding: 10px;
    border: 1px solid var(--minca-rule);
    border-radius: var(--minca-radius-lg);
    background: var(--minca-sunken);
  }
  /* A card opened: one column of it, in the middle */
  .page {
    display: flex;
    flex-direction: column;
    gap: 22px;
    max-width: 680px;
    margin: 0 auto;
    padding: 18px 16px 48px;
  }
  .card-title {
    min-height: 0;
    padding: 0;
    border: none;
    border-radius: 0;
    background: none;
    color: var(--minca-ink);
    font-family: var(--minca-display);
    font-size: 26px;
    font-weight: 700;
    letter-spacing: -0.03em;
    line-height: 1.2;
  }
  .card-title:focus {
    outline: none;
  }
  .part-of {
    align-self: flex-start;
    min-height: 30px;
    padding: 0 12px;
    font-weight: 400;
  }
  .field {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .rows {
    margin: 0;
    padding: 0;
    list-style: none;
    overflow: hidden;
    background: var(--minca-card);
    border: 1px solid var(--minca-rule);
    border-radius: var(--minca-radius-lg);
  }
  .rows > li + li {
    border-top: 1px solid var(--minca-line);
  }
  .item {
    display: flex;
    align-items: center;
    gap: 12px;
    min-height: 52px;
    padding: 6px 8px 6px 16px;
  }
  .item > span {
    flex: 1;
    min-width: 0;
    color: var(--minca-ink);
    font-size: 15px;
    overflow-wrap: anywhere;
  }
  .item[data-done='true'] > span {
    color: var(--minca-faint);
    text-decoration: line-through;
  }
  .item input {
    flex: 1;
    min-width: 0;
    min-height: 36px;
    padding: 0;
    border: none;
    border-radius: 0;
    background: none;
    font-size: 15px;
  }
  .item input:focus {
    outline: none;
  }
  .item form {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .tick {
    width: 24px;
    height: 24px;
    min-height: 0;
    flex-shrink: 0;
    padding: 0;
    border: 1.5px solid var(--minca-line-strong);
    border-radius: 50%;
    background: none;
    color: var(--minca-inverse);
  }
  .tick:hover {
    border-color: var(--minca-accent);
    background: none;
  }
  .tick[aria-checked='true'] {
    border-color: var(--minca-accent);
    background: var(--minca-accent);
  }
  .plus {
    width: 24px;
    flex-shrink: 0;
    color: var(--minca-muted);
    font-size: 20px;
    line-height: 1;
    text-align: center;
  }
  .bar {
    height: 4px;
    border-radius: var(--minca-radius-pill);
    background: var(--minca-sunken);
    overflow: hidden;
  }
  .bar > span {
    display: block;
    height: 100%;
    background: var(--minca-good);
  }
  .chips {
    flex-wrap: wrap;
  }
  @media (max-width: 640px) {
    .board {
      scroll-snap-type: x mandatory;
    }
    .lane,
    .new-column {
      flex-basis: calc(100vw - 56px);
    }
    .chips {
      flex-wrap: nowrap;
    }
  }
</style>
<script>
  const { html, render, useState, useEffect, useRef, useRecords, useCan, usePeople, useShown, useView } = ui;
  const { Avatar, Person, Empty, Comments, Attachments, attach, positionBetween } = ui;
  const TASK = 'std.task';
  const COLUMN = 'std.column';
  const COMMENT = 'std.comment';
  const FILE = 'std.file';
  const me = minca.me.did;
  const has = (collection) => minca.collections.includes(collection);
  /** The lane for tasks whose column is gone, or that never had one */
  const LOOSE = '';
  /** std.task's priority, 1 urgent to 4 low (0 or none: no label), each with a colour */
  const PRIORITIES = [
    [1, 'Urgent', 'coral'],
    [2, 'High', 'peach'],
    [3, 'Medium', 'lilac'],
    [4, 'Low', 'sage'],
  ];
  /** Dragging is for a mouse; on a touchscreen a card moves from its own page */
  const canDrag = matchMedia('(pointer: fine)').matches;

  /** By position; records without one go last, oldest first */
  const byPosition = (a, b) => {
    const pa = a.body.position;
    const pb = b.body.position;
    if (pa !== pb) return pa === undefined ? 1 : pb === undefined ? -1 : pa < pb ? -1 : 1;
    return a.createdAt.localeCompare(b.createdAt) || a.key.localeCompare(b.key);
  };
  const linkOf = (r, rel) => r.links.find((l) => l.rel === rel)?.to;
  // A task is `in` its column; one `in` a project with no column on the board is loose.
  const columnLinks = (lane) => (lane === LOOSE ? [] : [{ rel: 'in', to: lane }]);
  // Anyone can write records without this screen: read only what is there.
  const isTask = (r) => r.body && typeof r.body.title === 'string';
  const assigneesOf = (t) =>
    Array.isArray(t.body.assignees) ? t.body.assignees.filter((d) => typeof d === 'string') : [];
  const today = () => {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  };
  const dayOf = (due) => (typeof due === 'string' ? due.slice(0, 10) : null);
  const dueText = (day) =>
    new Date(`${day}T12:00:00`).toLocaleDateString(undefined, { day: 'numeric', month: 'short' });
  const nameIn = (people, did) =>
    did === me ? 'You' : (people.find((p) => p.did === did)?.name ?? 'Someone');
  const tickIcon = html`<svg width="12" height="12" viewBox="0 0 16 16" aria-hidden="true">
    <path
      d="M3 8.5 6.5 12 13 4.5"
      fill="none"
      stroke="currentColor"
      stroke-width="2.2"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </svg>`;

  /** Whether the person looking may do this to a record: null until known */
  function useMay(action, key) {
    const [may, setMay] = useState(null);
    useEffect(() => {
      let current = true;
      minca.can(action, key).then((answer) => current && setMay(answer));
      return () => {
        current = false;
      };
    }, [action, key]);
    return may;
  }

  function Board() {
    const columns = useRecords(COLUMN);
    const all = useRecords(TASK);
    // A copy of this app may not have comments or files; the same on every draw, so the hooks keep their order
    const comments = has(COMMENT) ? useRecords(COMMENT) : [];
    const files = has(FILE) ? useRecords(FILE) : [];
    const people = usePeople() ?? [];
    const mayAddTask = useCan('create', TASK);
    const mayAddColumn = useCan('create', COLUMN);
    const [dragging, setDraggingState] = useState(null);
    // Where a dragged card would land: a lane, and the card it would go before (null: the end)
    const [drop, setDropState] = useState(null);
    // The same, as the drop reads them: events can come faster than the board redraws.
    const dragged = useRef(null);
    const landed = useRef(null);
    const setDragging = (key) => {
      dragged.current = key;
      setDraggingState(key);
    };
    const setDrop = (to) => {
      landed.current = to;
      setDropState(to);
    };
    const [addingTo, setAddingTo] = useState(null);
    const [addingColumn, setAddingColumn] = useState(false);
    // Only the cards one person is on: their did, or null for everyone's
    const [only, setOnly] = useState(null);
    // A card is one level in: the app's bar names it, and its Back comes back to the board.
    const [view, go] = useView();
    // A task opened from elsewhere, like one shared in a chat: its card.
    const asked = useShown();
    useEffect(() => {
      if (asked) go(asked.key);
    }, [asked]);
    // The bar names the open card, once it is here, and again when it is renamed.
    const openTitle = view && all?.find((t) => t.key === view)?.body?.title;
    useEffect(() => {
      if (typeof openTitle === 'string') go(view, openTitle);
    }, [view, openTitle]);
    if (!columns || !all || !comments || !files) return null;

    const tasks = all.filter(isTask);
    const cols = columns.filter((c) => c.body && typeof c.body.name === 'string').sort(byPosition);
    const known = new Set(cols.map((c) => c.key));
    // A checklist item is a task under a card, not a card of its own.
    const cards = tasks.filter((t) => !linkOf(t, 'parent')).sort(byPosition);
    const shown = only ? cards.filter((t) => assigneesOf(t).includes(only)) : cards;
    const childrenOf = (key) => tasks.filter((t) => linkOf(t, 'parent') === key).sort(byPosition);
    const countAbout = (records, key) => records.filter((r) => linkOf(r, 'about') === key).length;
    const laneOf = (t) => (known.has(linkOf(t, 'in')) ? linkOf(t, 'in') : LOOSE);
    const tasksIn = (lane) => shown.filter((t) => laneOf(t) === lane);
    const nextIn = (lane, key) => {
      const list = tasksIn(lane);
      return list[list.findIndex((t) => t.key === key) + 1]?.key ?? null;
    };
    const lanes = [
      ...(cards.some((t) => laneOf(t) === LOOSE) ? [{ key: LOOSE, name: 'No column', record: null }] : []),
      ...cols.map((c) => ({ key: c.key, name: c.body.name, record: c })),
    ];
    const assigned = [...new Set(cards.flatMap(assigneesOf))];

    const place = (lane, before, moving) => {
      const list = cards.filter((t) => laneOf(t) === lane && t.key !== moving);
      const at =
        before === null
          ? list.length
          : Math.max(
              0,
              list.findIndex((t) => t.key === before),
            );
      // Unpositioned tasks sit at the end, so the nearest positioned ones are the neighbours.
      const prev = list
        .slice(0, at)
        .reverse()
        .find((t) => t.body.position)?.body.position;
      const next = list.slice(at).find((t) => t.body.position)?.body.position;
      return positionBetween(prev, next);
    };
    const move = (key, to) => {
      const t = cards.find((x) => x.key === key);
      if (!t) return;
      const lane = laneOf(t);
      if (lane === to.lane && (to.before === key || nextIn(lane, key) === to.before)) return; // dropped where it was
      return minca.update(
        key,
        { ...t.body, position: place(to.lane, to.before, key) },
        { links: [...t.links.filter((l) => l.rel !== 'in'), ...columnLinks(to.lane)] },
      );
    };
    const startColumns = async () => {
      let position = null;
      for (const name of ['To do', 'Doing', 'Done']) {
        position = positionBetween(position);
        await minca.put(COLUMN, { name, position });
      }
    };

    if (view) {
      const opened = tasks.find((t) => t.key === view);
      if (!opened)
        return html`<${Empty}
          shape="columns"
          colour="cobalt"
          title="This card isn't here"
          text="It may have been deleted."
        />`;
      const parent = tasks.find((t) => t.key === linkOf(opened, 'parent'));
      return html`<${CardPage}
        key=${opened.key}
        task=${opened}
        parent=${parent ?? null}
        lanes=${lanes.filter((l) => l.record)}
        lane=${laneOf(opened)}
        checklist=${childrenOf(opened.key)}
        onMove=${(lane) => move(opened.key, { lane, before: null })}
        go=${go}
      />`;
    }

    if (cols.length === 0 && cards.length === 0)
      return html`<${Empty}
        shape="columns"
        colour="cobalt"
        title="No board yet"
        text="Columns for each stage of the work, and cards that move along them."
      >
        ${mayAddColumn && html`<button data-variant="primary" onClick=${startColumns}>Start with To do, Doing, Done</button>`}
      </${Empty}>`;

    const endDrag = () => {
      setDragging(null);
      setDrop(null);
    };
    const overCard = (event, lane, key) => {
      if (!dragged.current) return;
      event.preventDefault();
      event.stopPropagation();
      const box = event.currentTarget.getBoundingClientRect();
      const before = event.clientY < box.top + box.height / 2 ? key : nextIn(lane, key);
      if (landed.current?.lane !== lane || landed.current.before !== before) setDrop({ lane, before });
    };
    const landing = (lane, before) => dragging !== null && drop?.lane === lane && drop.before === before;

    return html`<div>
      ${
        assigned.length > 0 &&
        html`<div class="toolbar scroll-x" role="group" aria-label="Show the cards of">
          <button class="chip" aria-pressed=${only === null} onClick=${() => setOnly(null)}>Everyone</button>
          ${
            assigned.includes(me) &&
            html`<button
              class="chip"
              aria-pressed=${only === me}
              onClick=${() => setOnly(only === me ? null : me)}
            >
              Mine
            </button>`
          }
          ${assigned
            .filter((did) => did !== me)
            .map(
              (did) =>
                html`<button
                  key=${did}
                  class="chip"
                  aria-pressed=${only === did}
                  onClick=${() => setOnly(only === did ? null : did)}
                >
                  <${Avatar} did=${did} size=${20} round /> ${nameIn(people, did)}
                </button>`,
            )}
        </div>`
      }
      <div class="board">
        ${lanes.map(
          (lane) =>
            html`<section
              class="lane"
              key=${lane.key}
              aria-label=${lane.name}
              onDragOver=${(event) => {
                if (!dragged.current) return;
                event.preventDefault();
                if (landed.current?.lane !== lane.key || landed.current.before !== null)
                  setDrop({ lane: lane.key, before: null });
              }}
              onDrop=${(event) => {
                event.preventDefault();
                const to =
                  landed.current?.lane === lane.key ? landed.current : { lane: lane.key, before: null };
                if (dragged.current) move(dragged.current, to);
                endDrag();
              }}
            >
              <${LaneHeader}
                lane=${lane}
                count=${tasksIn(lane.key).length}
                empty=${!cards.some((t) => laneOf(t) === lane.key)}
              />
              ${tasksIn(lane.key).map(
                (t) =>
                  html`<div key=${t.key} class="stack" style="gap: 8px">
                    ${landing(lane.key, t.key) && html`<div class="marker" aria-hidden="true"></div>`}
                    <${Card}
                      task=${t}
                      checklist=${childrenOf(t.key)}
                      comments=${countAbout(comments, t.key)}
                      files=${countAbout(files, t.key)}
                      faded=${dragging === t.key}
                      onOpen=${() => go(t.key, t.body.title)}
                      onDragStart=${() => setDragging(t.key)}
                      onDragEnd=${endDrag}
                      onDragOver=${(event) => overCard(event, lane.key, t.key)}
                    />
                  </div>`,
              )}
              ${landing(lane.key, null) && html`<div class="marker" aria-hidden="true"></div>`}
              ${
                tasksIn(lane.key).length === 0 &&
                addingTo !== lane.key &&
                !landing(lane.key, null) &&
                html`<div class="lane-empty">${only ? 'None of theirs here' : 'No cards yet'}</div>`
              }
              ${
                mayAddTask &&
                (addingTo === lane.key
                  ? html`<${OneLine}
                      placeholder="Card title"
                      onDone=${() => setAddingTo(null)}
                      onSubmit=${(title) =>
                        minca.put(
                          TASK,
                          // Added while one person's cards are shown, it is theirs, so it stays in sight
                          { title, position: place(lane.key, null), ...(only ? { assignees: [only] } : {}) },
                          { links: columnLinks(lane.key) },
                        )}
                    />`
                  : html`<button class="add" data-variant="ghost" onClick=${() => setAddingTo(lane.key)}>
                      + Add a card
                    </button>`)
              }
            </section>`,
        )}
        ${
          mayAddColumn &&
          html`<div class="new-column">
            ${
              addingColumn
                ? html`<${OneLine}
                    placeholder="Column name"
                    onDone=${() => setAddingColumn(false)}
                    onSubmit=${(name) =>
                      minca.put(COLUMN, {
                        name,
                        position: positionBetween(
                          [...cols].reverse().find((c) => c.body.position)?.body.position,
                        ),
                      })}
                  />`
                : html`<button onClick=${() => setAddingColumn(true)}>+ Add column</button>`
            }
          </div>`
        }
      </div>
    </div>`;
  }

  /** A column's name, renamed in place; an empty column can be taken away */
  function LaneHeader({ lane, count, empty }) {
    const key = lane.record?.key ?? '';
    const mayRename = useMay('edit', key) === true;
    const mayDelete = useMay('delete', key) === true;
    const [renaming, setRenaming] = useState(false);
    if (!lane.record)
      return html`<header>
        <span class="muted" style="flex: 1; font-weight: 600">${lane.name}</span
        ><span class="count">${count}</span>
      </header>`;
    return html`<header>
      ${
        renaming
          ? html`<${OneLine}
              placeholder="Column name"
              initial=${lane.name}
              onDone=${() => setRenaming(false)}
              onSubmit=${async (name) => {
                setRenaming(false);
                await minca.update(key, { ...lane.record.body, name });
              }}
            />`
          : html`<button
              class="name"
              title=${mayRename ? 'Rename this column' : undefined}
              disabled=${!mayRename}
              onClick=${() => setRenaming(true)}
            >
              ${lane.name}
            </button>`
      }
      ${!renaming && html`<span class="count">${count}</span>`}
      ${
        mayDelete &&
        empty &&
        !renaming &&
        html`<button
          data-variant="ghost"
          data-icon
          title="Delete this empty column"
          aria-label="Delete this column"
          onClick=${() => minca.remove(key)}
        >
          ✕
        </button>`
      }
    </header>`;
  }

  /** A card on the board: its label, title, and what is on it at a glance */
  function Card({ task, checklist, comments, files, faded, onOpen, onDragStart, onDragEnd, onDragOver }) {
    // Draggable until the answer is no, so a card just added moves at once
    const mayMove = useMay('edit', task.key) !== false;
    const { title, notes, priority } = task.body;
    const label = PRIORITIES.find(([p]) => p === priority);
    const due = dayOf(task.body.due);
    const late = due !== null && due < today();
    const done = checklist.filter((c) => c.body.status === 'done').length;
    const faces = assigneesOf(task);
    const more = due || notes || checklist.length > 0 || comments > 0 || files > 0 || faces.length > 0;
    return html`<button
      type="button"
      class="task"
      data-key=${task.key}
      draggable=${canDrag && mayMove}
      style=${{ opacity: faded ? 0.4 : 1 }}
      onDragStart=${(event) => {
        event.dataTransfer.effectAllowed = 'move';
        event.dataTransfer.setData('text/plain', title);
        onDragStart();
      }}
      onDragEnd=${onDragEnd}
      onDragOver=${onDragOver}
      onClick=${onOpen}
    >
      ${label && html`<span class=${`pill c-${label[2]}`}>${label[1]}</span>`}
      <span>${title}</span>
      ${
        more &&
        html`<span class="meta">
          ${due && html`<span class=${late ? 'late' : ''} title=${late ? 'Overdue' : 'Due'}>◷ ${dueText(due)}</span>`}
          ${notes && html`<span title="Has a description">≡</span>`}
          ${checklist.length > 0 && html`<span title="Checklist">☑ ${done}/${checklist.length}</span>`}
          ${comments > 0 && html`<span title="Comments">💬 ${comments}</span>`}
          ${files > 0 && html`<span title="Attachments">📎 ${files}</span>`}
          ${
            faces.length > 0 &&
            html`<span class="faces">
              ${faces.slice(0, 4).map((did) => html`<${Avatar} key=${did} did=${did} size=${22} round />`)}
            </span>`
          }
        </span>`
      }
    </button>`;
  }

  /** A card opened, one level in: everything on it, each part changed where it is shown */
  function CardPage({ task, parent, lanes, lane, checklist, onMove, go }) {
    const people = usePeople() ?? [];
    const mayEdit = useMay('edit', task.key) !== false;
    const mayDelete = useMay('delete', task.key) === true;
    const mayAddItem = useCan('create', TASK);
    const [title, setTitle] = useState(task.body.title);
    const [notes, setNotes] = useState(task.body.notes ?? '');
    const [error, setError] = useState(null);
    const [deleting, setDeleting] = useState(false);
    const fileInput = useRef(null);
    // What someone else changed shows, unless this person is changing it too
    useEffect(() => setTitle(task.body.title), [task.body.title]);
    useEffect(() => setNotes(task.body.notes ?? ''), [task.body.notes]);

    /** Sets one field, or takes it off when empty */
    const set = (field, value) => {
      const body = { ...task.body, [field]: value };
      if (value === null || value === '' || (Array.isArray(value) && value.length === 0)) delete body[field];
      return minca.update(task.key, body).catch((e) => setError(e.message));
    };
    const assignees = assigneesOf(task);
    const due = dayOf(task.body.due);
    const done = checklist.filter((c) => c.body.status === 'done').length;
    const remove = async () => {
      // Its checklist first, so nothing is left under a card that is gone
      await Promise.allSettled(checklist.map((item) => minca.remove(item.key)));
      await minca.remove(task.key);
      if (parent) go(parent.key, parent.body.title);
      else go(null);
    };

    return html`<div class="page">
      ${
        parent &&
        html`<button class="part-of" onClick=${() => go(parent.key, parent.body.title)}>
          On the card <b>${parent.body.title}</b>
        </button>`
      }
      <input
        class="card-title"
        value=${title}
        readonly=${!mayEdit}
        aria-label="Title"
        maxlength="200"
        onInput=${(e) => setTitle(e.currentTarget.value)}
        onKeyDown=${(e) => e.key === 'Enter' && e.currentTarget.blur()}
        onBlur=${() => title.trim() && title.trim() !== task.body.title && set('title', title.trim())}
      />
      ${
        !parent &&
        lanes.length > 0 &&
        html`<div class="field">
          <span class="label">Column</span>
          <div class="row chips scroll-x" role="group" aria-label="Move to">
            ${lane === LOOSE && html`<button class="chip" aria-pressed="true" disabled>No column</button>`}
            ${lanes.map(
              (l) =>
                html`<button
                  key=${l.key}
                  class="chip"
                  aria-pressed=${l.key === lane}
                  disabled=${!mayEdit}
                  onClick=${() => l.key !== lane && onMove(l.key)}
                >
                  ${l.name}
                </button>`,
            )}
          </div>
        </div>`
      }
      <div class="field">
        <span class="label">Members</span>
        <div class="row chips scroll-x">
          ${people.map(
            (p) =>
              html`<button
                key=${p.did}
                class="chip"
                aria-pressed=${assignees.includes(p.did)}
                disabled=${!mayEdit}
                onClick=${() =>
                  set(
                    'assignees',
                    assignees.includes(p.did) ? assignees.filter((d) => d !== p.did) : [...assignees, p.did],
                  )}
              >
                <${Avatar} did=${p.did} size=${18} round /> ${nameIn(people, p.did)}
              </button>`,
          )}
        </div>
      </div>
      <div class="field">
        <span class="label">Due</span>
        <div class="row">
          <input
            type="date"
            value=${due ?? ''}
            disabled=${!mayEdit}
            style="max-width: 200px"
            onChange=${(e) => set('due', e.currentTarget.value)}
          />
          ${due && due < today() && html`<span class="late" style="font-size: 13px">Overdue</span>`}
        </div>
      </div>
      <div class="field">
        <span class="label">Priority</span>
        <div class="row chips scroll-x">
          <button
            class="chip"
            aria-pressed=${!task.body.priority}
            disabled=${!mayEdit}
            onClick=${() => set('priority', null)}
          >
            None
          </button>
          ${PRIORITIES.map(
            ([p, name]) =>
              html`<button
                key=${p}
                class="chip"
                aria-pressed=${task.body.priority === p}
                disabled=${!mayEdit}
                onClick=${() => set('priority', p)}
              >
                ${name}
              </button>`,
          )}
        </div>
      </div>
      <div class="field">
        <span class="label">Description</span>
        <textarea
          rows="4"
          value=${notes}
          readonly=${!mayEdit}
          placeholder="Add more detail…"
          onInput=${(e) => setNotes(e.currentTarget.value)}
          onBlur=${() => notes !== (task.body.notes ?? '') && set('notes', notes)}
        ></textarea>
      </div>
      ${
        !parent &&
        html`<div class="field">
          <div class="row">
            <span class="label" style="flex: 1">Checklist</span>
            ${checklist.length > 0 && html`<span class="faint">${done}/${checklist.length}</span>`}
          </div>
          ${
            checklist.length > 0 &&
            html`<div class="bar">
              <span style=${{ width: `${(done / checklist.length) * 100}%` }}></span>
            </div>`
          }
          ${
            (checklist.length > 0 || mayAddItem) &&
            html`<ul class="rows" aria-label="Checklist">
              ${checklist.map(
                (item) =>
                  html`<${CheckItem}
                    key=${item.key}
                    item=${item}
                    onOpen=${() => go(item.key, item.body.title)}
                  />`,
              )}
              ${
                mayAddItem &&
                html`<li class="item">
                  <${AddItem}
                    onAdd=${(itemTitle) =>
                      minca.put(
                        TASK,
                        {
                          title: itemTitle,
                          status: 'todo',
                          position: positionBetween(checklist.at(-1)?.body.position),
                        },
                        { links: [{ rel: 'parent', to: task.key }] },
                      )}
                  />
                </li>`
              }
            </ul>`
          }
        </div>`
      }
      ${
        has(FILE) &&
        html`<div class="field">
          <div class="row">
            <span class="label" style="flex: 1">Attachments</span>
            <button onClick=${() => fileInput.current?.click()}>Attach a file</button>
            <input
              ref=${fileInput}
              type="file"
              multiple
              hidden
              onChange=${(e) => {
                attach(task.key, e.currentTarget.files).catch((err) => setError(err.message));
                e.currentTarget.value = '';
              }}
            />
          </div>
          <${Attachments} about=${task.key} />
        </div>`
      }
      ${error && html`<p class="error">${error}</p>`} ${has(COMMENT) && html`<${Comments} about=${task} />`}
      <div class="row" style="flex-wrap: wrap">
        <span class="faint" style="flex: 1">Added by <${Person} did=${task.createdBy} face=${false} /></span>
        ${
          mayDelete &&
          (deleting
            ? html`<button data-variant="danger" onClick=${remove}>Delete for everyone</button>
                <button data-variant="ghost" onClick=${() => setDeleting(false)}>Keep it</button>`
            : html`<button data-variant="ghost" onClick=${() => setDeleting(true)}>
                Delete ${parent ? 'item' : 'card'}
              </button>`)
        }
      </div>
    </div>`;
  }

  /** One item of a card's checklist: ticked here, or opened as a task of its own */
  function CheckItem({ item, onOpen }) {
    const mayEdit = useMay('edit', item.key) !== false;
    const isDone = item.body.status === 'done';
    return html`<li class="item" data-done=${isDone}>
      <button
        class="tick"
        role="checkbox"
        aria-checked=${isDone}
        aria-label=${isDone ? 'Not done' : 'Done'}
        disabled=${!mayEdit}
        onClick=${() => minca.update(item.key, { ...item.body, status: isDone ? 'todo' : 'done' })}
      >
        ${isDone && tickIcon}
      </button>
      <span>${item.body.title}</span>
      ${assigneesOf(item).map((did) => html`<${Avatar} key=${did} did=${did} size=${20} round />`)}
      <button data-variant="ghost" data-icon aria-label="Open this item" onClick=${onOpen}>›</button>
    </li>`;
  }

  /** The checklist's last row: Enter adds, and the field stays for the next */
  function AddItem({ onAdd }) {
    const [text, setText] = useState('');
    return html`<form
      onSubmit=${(e) => {
        e.preventDefault();
        if (!text.trim()) return;
        onAdd(text.trim());
        setText('');
      }}
    >
      <span class="plus" aria-hidden="true">+</span>
      <input
        value=${text}
        placeholder="Add an item"
        aria-label="Add an item"
        maxlength="200"
        enterkeyhint="next"
        onInput=${(e) => setText(e.currentTarget.value)}
      />
      ${text.trim() && html`<button type="submit" data-variant="primary">Add</button>`}
    </form>`;
  }

  /**
   * A one-line input that adds on Enter and stays open for the next. It takes
   * the cursor and closes on Escape or when left empty.
   */
  function OneLine({ placeholder, onSubmit, onDone, initial = '' }) {
    const [text, setText] = useState(initial);
    // autofocus only works on what the page loads with, not on what is added later
    const input = useRef(null);
    useEffect(() => input.current?.select(), []);
    return html`<form
      onSubmit=${(event) => {
        event.preventDefault();
        if (text.trim()) onSubmit(text.trim());
        setText('');
      }}
    >
      <input
        ref=${input}
        value=${text}
        maxlength="200"
        enterkeyhint=${initial ? 'done' : 'next'}
        onInput=${(event) => setText(event.currentTarget.value)}
        onKeyDown=${(event) => event.key === 'Escape' && onDone()}
        onBlur=${() => (!text.trim() || initial) && onDone()}
        placeholder=${placeholder}
        aria-label=${placeholder}
      />
    </form>`;
  }

  render(html`<${Board} />`);
</script>
