# For a Netlify site whose base directory is `apps/example` (app.minca.social).
# The app compiles the protocol from packages/core/src, so the whole workspace
# is installed, from the repository root.
[build]
  command = "cd ../.. && npm ci && npm run build -w apps/example"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
