# Your agent on Fly, always on: `minca agent --no-chat` runs your rules
# (std.automation) with every device closed. Or a community's bot, with its own account.
# Change `app` to a name of your own, then, from the repository root:
#
#   fly launch --no-deploy --copy-config --config packages/cli/fly.agent.toml --name my-agent
#   fly volumes create agent_data --size 1 --region ams --config packages/cli/fly.agent.toml
#   fly secrets set --config packages/cli/fly.agent.toml ANTHROPIC_API_KEY=sk-ant-…
#   fly deploy . --config packages/cli/fly.agent.toml
#
# Your agent: in an app, choose "Connect an agent", copy the mc_… code, and
#
#   fly ssh console --config packages/cli/fly.agent.toml -C "minca connect --no-configure --name 'Agent on Fly'"
#
# then allow it at your account home. It starts within half a minute.
#
# A community's bot instead: set MINCA_AGENT_ARGS = "--bot" below, then copy
# the command the app shows under "Set up this community", Add a bot, and run
# it over `fly ssh console` (its password as the secret MINCA_PASSPHRASE too,
# so restarts unlock it):
#
#   fly ssh console --config packages/cli/fly.agent.toml
#   minca agent --bot --name 'Club Bot' --invite 'https://…#invite=…'   # Ctrl-C once it has joined
#   fly secrets set --config packages/cli/fly.agent.toml MINCA_PASSPHRASE=…
#
# If the account uses a host, name it in MINCA_HOSTS: the agent then finds
# every space through the host's socket, even with none of your devices on.

app = "my-agent"
primary_region = "ams"
kill_timeout = 30

[build]
  dockerfile = "Dockerfile.agent"

[env]
  # Flags for `minca agent --no-chat`: "--bot", "--daily-cap 5", "--model claude-sonnet-5-5"
  MINCA_AGENT_ARGS = ""
  # MINCA_HOSTS = "https://weave-host.fly.dev"

# The agent's key, its note and its copy of your spaces.
[mounts]
  source = "agent_data"
  destination = "/data"

# No http_service: nothing reaches in. The agent dials out to relays and hosts.

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
