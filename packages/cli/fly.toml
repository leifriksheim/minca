# A hosting service on Fly: `minca host`, keeping people's spaces online.
# Change `app` to a name of your own, then, from the repository root:
#
#   fly launch --no-deploy --copy-config --config packages/cli/fly.toml --name my-host
#   fly volumes create host_data --size 1 --region ams --config packages/cli/fly.toml
#   fly secrets set --config packages/cli/fly.toml \
#     MINCA_S3_ENDPOINT=https://<account>.r2.cloudflarestorage.com \
#     MINCA_S3_BUCKET=… MINCA_S3_ACCESS_KEY_ID=… MINCA_S3_SECRET_ACCESS_KEY=… \
#     MINCA_WALLET_ADDRESS=0x… \
#     STRIPE_SECRET_KEY=sk_live_… STRIPE_WEBHOOK_SECRET=whsec_… \
#     STRIPE_PRICE_MONTHLY=price_… STRIPE_PRICE_YEARLY=price_…
#   fly deploy . --config packages/cli/fly.toml
#
# It needs at least one way to be paid: Stripe (both STRIPE_ keys) or a wallet
# (MINCA_WALLET_ADDRESS). Point Stripe's webhook at
# https://my-host.fly.dev/host/billing/webhook, and set MINCA_HOST_URL below
# to the host's own address.

app = "minca-host"
primary_region = "ams"
# Give it time to finish writing before a deploy replaces it.
kill_timeout = 30

[build]
  dockerfile = "Dockerfile"

[env]
  MINCA_HOST_NAME = "Minca host"
  MINCA_HOST_URL = "https://minca-host.fly.dev"
  # Free for the accounts named in the MINCA_HOST_ALLOW secret, and no one
  # else: a free host anyone could reach would carry spaces for anyone.
  # Add one with `fly secrets set MINCA_HOST_ALLOW=did:key:…,did:key:…`.
  MINCA_HOST_FREE = "1"
  MINCA_HOST_QUOTA_GB = "0.5"
  MINCA_WALLET_NETWORK = "base"
  MINCA_WALLET_MONTHLY = "4"
  MINCA_WALLET_YEARLY = "36"

# The host's key and subscriptions live here, and must outlive every deploy:
# lose the key and every home that trusts this host stops trusting it. The
# spaces themselves are also kept in the R2 bucket, so this stays small.
[mounts]
  source = "host_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true

  # Unlike the relay, a host is a device that never sleeps.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.http_options]
    # Long-lived sockets: peers stay connected to sync.
    idle_timeout = 900

  [[http_service.checks]]
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

# One machine only: the volume belongs to one machine, and the subscriptions
# aren't shared between copies. Don't `fly scale count` past 1.
[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
